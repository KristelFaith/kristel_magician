<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kristel Magician · Таро та езотеричні консультації</title>
<meta name="description" content="Таро, езотеричні консультації та енергетичні практики онлайн. Спокійна розмова, ясний погляд на ситуацію, наступний крок. Kristel Magician.">
<meta name="theme-color" content="#0B0C10">

<!-- Open Graph -->
<meta property="og:type" content="website">
<meta property="og:title" content="Kristel Magician · Таро та езотеричні консультації">
<meta property="og:description" content="Таро, езотеричні консультації та енергетичні практики онлайн. Спокійна розмова, ясний погляд на ситуацію.">
<meta property="og:locale" content="uk_UA">
<meta property="og:locale:alternate" content="en_US">
<meta property="og:site_name" content="Kristel Magician">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Kristel Magician · Tarot & Esoteric Consultations">
<meta name="twitter:description" content="Online tarot readings and esoteric consultations. Clarity, calm guidance, next steps.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #0B0C10;
  --bg-elevated: #12131C;
  --bg-card: rgba(26, 22, 40, 0.72);
  --purple-deep: #2A1B3D;
  --purple: #44318D;
  --purple-soft: #6B5B95;
  --gold: #D4AF37;
  --gold-bright: #E5C158;
  --gold-dim: rgba(212, 175, 55, 0.35);
  --ink: #F2EDE6;
  --muted: #A89BB8;
  --line: rgba(212, 175, 55, 0.14);
  --line-strong: rgba(212, 175, 55, 0.28);
  --serif-display: "Cinzel", "Cormorant Garamond", Georgia, serif;
  --serif: "Cormorant Garamond", Georgia, serif;
  --sans: "Inter", system-ui, -apple-system, sans-serif;
  --radius: 14px;
  --header-h: 64px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}

body {
  background: var(--bg);
  color: var(--ink);
  font: 400 16px/1.65 var(--sans);
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse 70% 45% at 50% -5%, rgba(68, 49, 141, 0.22), transparent 55%),
    radial-gradient(ellipse 40% 30% at 95% 60%, rgba(42, 27, 61, 0.35), transparent 50%),
    radial-gradient(ellipse 35% 25% at 5% 80%, rgba(212, 175, 55, 0.04), transparent 45%);
  pointer-events: none;
  z-index: 0;
}

a { color: inherit; text-decoration: none; }
img { max-width: 100%; display: block; }
button { font: inherit; cursor: pointer; border: 0; background: none; color: inherit; }
ul { list-style: none; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }

.wrap {
  width: min(1080px, 100% - 40px);
  margin-inline: auto;
}

/* ——— HEADER ——— */
.header {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 100;
  height: var(--header-h);
  display: flex;
  align-items: center;
  background: rgba(11, 12, 16, 0.82);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--line);
  transition: background 0.3s;
}
.header .wrap {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
}
.logo {
  font-family: var(--serif-display);
  font-weight: 500;
  font-size: 15px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink);
}
.logo span { color: var(--gold); }

.nav {
  display: flex;
  align-items: center;
  gap: 28px;
}
.nav a {
  font-size: 12px;
  font-weight: 500;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--muted);
  transition: color 0.2s;
}
.nav a:hover { color: var(--gold-bright); }

.lang {
  display: flex;
  border: 1px solid var(--line-strong);
  border-radius: 999px;
  overflow: hidden;
}
.lang button {
  padding: 5px 12px;
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.06em;
  color: var(--muted);
  transition: all 0.2s;
}
.lang button[aria-pressed="true"] {
  background: linear-gradient(135deg, var(--purple), #5a4499);
  color: #fff;
}

.burger {
  display: none;
  width: 40px;
  height: 40px;
  place-items: center;
  border: 1px solid var(--line);
  border-radius: 8px;
}
.burger span {
  display: block;
  width: 18px;
  height: 1.5px;
  background: var(--ink);
  position: relative;
  transition: background 0.2s;
}
.burger span::before,
.burger span::after {
  content: "";
  position: absolute;
  left: 0;
  width: 18px;
  height: 1.5px;
  background: var(--ink);
  transition: transform 0.25s;
}
.burger span::before { top: -6px; }
.burger span::after { top: 6px; }
.burger[aria-expanded="true"] span { background: transparent; }
.burger[aria-expanded="true"] span::before { transform: translateY(6px) rotate(45deg); }
.burger[aria-expanded="true"] span::after { transform: translateY(-6px) rotate(-45deg); }

.mobile-nav {
  display: none;
  position: fixed;
  top: var(--header-h);
  left: 0; right: 0;
  background: rgba(11, 12, 16, 0.96);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--line);
  padding: 20px 24px 28px;
  flex-direction: column;
  gap: 8px;
  z-index: 99;
}
.mobile-nav.open { display: flex; }
.mobile-nav a {
  padding: 12px 8px;
  font-size: 14px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
  border-bottom: 1px solid var(--line);
}
.mobile-nav a:hover { color: var(--gold); }

/* ——— HERO ——— */
.hero {
  position: relative;
  z-index: 1;
  min-height: 100svh;
  display: grid;
  place-items: center;
  text-align: center;
  padding: calc(var(--header-h) + 48px) 20px 64px;
}
.hero-inner { max-width: 680px; }
.hero-ornament {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 14px;
  margin-bottom: 28px;
  color: var(--gold);
  font-size: 11px;
  letter-spacing: 0.35em;
}
.hero-ornament::before,
.hero-ornament::after {
  content: "";
  width: 48px;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--gold-dim), transparent);
}
.hero h1 {
  font-family: var(--serif-display);
  font-weight: 400;
  font-size: clamp(2rem, 5.5vw, 3.4rem);
  line-height: 1.15;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  margin-bottom: 20px;
  color: var(--ink);
}
.hero h1 em {
  font-style: normal;
  color: var(--gold-bright);
}
.hero-lead {
  font-family: var(--serif);
  font-size: clamp(1.05rem, 2.2vw, 1.25rem);
  font-weight: 400;
  color: var(--muted);
  max-width: 42ch;
  margin: 0 auto 36px;
  line-height: 1.7;
}
.hero-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  justify-content: center;
}

/* ——— BUTTONS ——— */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 14px 28px;
  font-size: 12px;
  font-weight: 500;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  border-radius: 999px;
  border: 1px solid transparent;
  transition: transform 0.2s, box-shadow 0.25s, background 0.2s, border-color 0.2s;
}
.btn:hover { transform: translateY(-2px); }
.btn-gold {
  background: linear-gradient(135deg, var(--gold), var(--gold-bright));
  color: #1a1408;
  box-shadow: 0 4px 24px rgba(212, 175, 55, 0.28);
}
.btn-gold:hover {
  box-shadow: 0 8px 32px rgba(212, 175, 55, 0.4);
}
.btn-outline {
  background: transparent;
  border-color: var(--line-strong);
  color: var(--gold-bright);
}
.btn-outline:hover {
  border-color: var(--gold);
  background: rgba(212, 175, 55, 0.06);
  box-shadow: 0 0 24px rgba(212, 175, 55, 0.12);
}

/* ——— SECTIONS ——— */
section {
  position: relative;
  z-index: 1;
  padding: 72px 0;
}
.section-head {
  text-align: center;
  margin-bottom: 40px;
}
.section-kicker {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--gold);
  margin-bottom: 12px;
}
.section-kicker::before,
.section-kicker::after {
  content: "✦";
  font-size: 9px;
  opacity: 0.7;
}
.section-head h2 {
  font-family: var(--serif-display);
  font-weight: 400;
  font-size: clamp(1.6rem, 3.5vw, 2.2rem);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  margin-bottom: 12px;
}
.section-head p {
  color: var(--muted);
  max-width: 48ch;
  margin-inline: auto;
  font-size: 15px;
}

/* ——— ABOUT ——— */
.about-grid {
  display: grid;
  grid-template-columns: 260px 1fr;
  gap: 40px;
  align-items: start;
  max-width: 900px;
  margin-inline: auto;
}
.about-photo {
  aspect-ratio: 3/4;
  border-radius: 160px 160px 12px 12px;
  background:
    linear-gradient(160deg, var(--purple-deep), #1a1228 60%, #0f0e16);
  border: 1px solid var(--line-strong);
  display: grid;
  place-items: center;
  position: relative;
  overflow: hidden;
  box-shadow: 0 0 40px rgba(68, 49, 141, 0.2);
}
.about-photo::before {
  content: "✦";
  position: absolute;
  top: 18px;
  right: 20px;
  color: var(--gold);
  opacity: 0.5;
  font-size: 14px;
}
.about-photo-label {
  text-align: center;
  color: var(--muted);
  font-size: 13px;
  padding: 16px;
  line-height: 1.5;
}
.about-body h3 {
  font-family: var(--serif);
  font-weight: 500;
  font-size: 1.5rem;
  margin-bottom: 14px;
  color: var(--ink);
}
.about-body p {
  color: var(--muted);
  margin-bottom: 14px;
  font-size: 15px;
  line-height: 1.75;
  max-width: 52ch;
}
.about-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 20px;
}
.tag {
  padding: 6px 14px;
  font-size: 11px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--lavender, var(--purple-soft));
  border: 1px solid rgba(107, 91, 149, 0.4);
  border-radius: 999px;
  color: var(--muted);
}

/* ——— PRICES ——— */
.badge-ua {
  display: none;
  width: fit-content;
  margin: -12px auto 28px;
  padding: 5px 14px;
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--gold-bright);
  border: 1px solid var(--gold-dim);
  border-radius: 999px;
  background: rgba(212, 175, 55, 0.06);
}
html[lang="uk"] .badge-ua { display: block; }

.prices-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 18px;
}
.card {
  position: relative;
  background: var(--bg-card);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 28px 22px 24px;
  display: flex;
  flex-direction: column;
  transition: border-color 0.25s, box-shadow 0.3s, transform 0.25s;
}
.card:hover {
  border-color: var(--line-strong);
  box-shadow: 0 12px 40px rgba(68, 49, 141, 0.2), 0 0 0 1px rgba(212, 175, 55, 0.08);
  transform: translateY(-4px);
}
.card.featured {
  border-color: rgba(212, 175, 55, 0.4);
  background: linear-gradient(165deg, rgba(212, 175, 55, 0.07), var(--bg-card));
}
.card.featured::before {
  content: "✦";
  position: absolute;
  top: -11px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--bg);
  color: var(--gold);
  padding: 0 12px;
  font-size: 13px;
}
.card-title {
  font-family: var(--serif);
  font-weight: 600;
  font-size: 1.35rem;
  margin-bottom: 4px;
}
.card-dur {
  font-size: 12px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--purple-soft);
  margin-bottom: 16px;
}
.card ul {
  flex: 1;
  margin-bottom: 20px;
}
.card li {
  position: relative;
  padding-left: 16px;
  margin-bottom: 8px;
  font-size: 14px;
  color: var(--muted);
  line-height: 1.5;
}
.card li::before {
  content: "✧";
  position: absolute;
  left: 0;
  color: var(--gold);
  font-size: 10px;
  top: 3px;
}
.card-price {
  font-family: var(--serif-display);
  font-size: 1.75rem;
  font-weight: 500;
  color: var(--gold-bright);
  letter-spacing: 0.02em;
}
.card-old {
  display: block;
  font-family: var(--sans);
  font-size: 13px;
  color: var(--muted);
  text-decoration: line-through;
  opacity: 0.6;
  margin-top: 2px;
  margin-bottom: 16px;
}
.card .btn {
  width: 100%;
  margin-top: auto;
  padding: 12px 16px;
  font-size: 11px;
}
.prices-note {
  text-align: center;
  margin-top: 24px;
  font-size: 13px;
  color: var(--muted);
  opacity: 0.8;
}

/* ——— SPACE ——— */
.space-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
}
.space-item {
  text-align: center;
}
.space-thumb {
  aspect-ratio: 4/3;
  border-radius: var(--radius);
  background: linear-gradient(145deg, var(--purple-deep), var(--bg-elevated));
  border: 1px solid var(--line);
  display: grid;
  place-items: center;
  color: var(--muted);
  font-size: 13px;
  margin-bottom: 12px;
  transition: border-color 0.2s, box-shadow 0.25s;
}
.space-thumb:hover {
  border-color: var(--line-strong);
  box-shadow: 0 0 28px rgba(68, 49, 141, 0.25);
}
.space-item h3 {
  font-family: var(--serif);
  font-weight: 500;
  font-size: 1.1rem;
  margin-bottom: 4px;
}
.space-item p {
  font-size: 13px;
  color: var(--muted);
}

/* ——— CONTACT ——— */
.contact {
  text-align: center;
}
.contact .section-head { margin-bottom: 28px; }
.contact-btns {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  justify-content: center;
}
.contact-hint {
  margin-top: 20px;
  font-size: 13px;
  color: var(--muted);
}

/* ——— FOOTER ——— */
.footer {
  position: relative;
  z-index: 1;
  padding: 28px 0 36px;
  border-top: 1px solid var(--line);
  text-align: center;
  font-size: 12px;
  letter-spacing: 0.06em;
  color: var(--muted);
}
.footer .symbol {
  color: var(--gold);
  margin-bottom: 8px;
  font-size: 14px;
  opacity: 0.7;
}

/* ——— RESPONSIVE ——— */
@media (max-width: 860px) {
  .prices-grid { grid-template-columns: 1fr; max-width: 380px; margin-inline: auto; }
  .space-grid { grid-template-columns: 1fr; max-width: 320px; margin-inline: auto; }
  .about-grid { grid-template-columns: 1fr; text-align: center; }
  .about-photo { max-width: 200px; margin-inline: auto; }
  .about-body p { margin-inline: auto; }
  .about-tags { justify-content: center; }
  .nav { display: none; }
  .burger { display: grid; }
  .hero { min-height: auto; padding-top: calc(var(--header-h) + 40px); padding-bottom: 56px; }
  section { padding: 56px 0; }
}

@media (max-width: 480px) {
  .wrap { width: min(100% - 28px, 1080px); }
  .hero h1 { letter-spacing: 0.03em; }
  .btn { padding: 12px 22px; }
}
</style>
</head>
<body>

<header class="header">
  <div class="wrap">
    <a class="logo" href="#top">Kristel <span>Magician</span></a>
    <nav class="nav" aria-label="Main">
      <a href="#about" data-i18n="nav_about"></a>
      <a href="#prices" data-i18n="nav_prices"></a>
      <a href="#space" data-i18n="nav_space"></a>
      <a href="#contact" data-i18n="nav_contact"></a>
      <div class="lang" role="group" aria-label="Language">
        <button type="button" data-lang="uk" aria-pressed="true">UA</button>
        <button type="button" data-lang="en" aria-pressed="false">EN</button>
      </div>
    </nav>
    <button class="burger" type="button" aria-label="Menu" aria-expanded="false" id="burger">
      <span></span>
    </button>
  </div>
</header>

<nav class="mobile-nav" id="mobileNav" aria-label="Mobile">
  <a href="#about" data-i18n="nav_about"></a>
  <a href="#prices" data-i18n="nav_prices"></a>
  <a href="#space" data-i18n="nav_space"></a>
  <a href="#contact" data-i18n="nav_contact"></a>
  <div class="lang" role="group" aria-label="Language" style="margin-top:12px;align-self:flex-start">
    <button type="button" data-lang="uk" aria-pressed="true">UA</button>
    <button type="button" data-lang="en" aria-pressed="false">EN</button>
  </div>
</nav>

<main id="top">
  <!-- HERO -->
  <section class="hero">
    <div class="hero-inner">
      <div class="hero-ornament">✦ · · · ✦</div>
      <h1 data-i18n="h1"></h1>
      <p class="hero-lead" data-i18n="hero_lead"></p>
      <div class="hero-actions">
        <a class="btn btn-gold" href="#prices" data-i18n="cta_primary"></a>
        <a class="btn btn-outline" href="#contact" data-i18n="cta_secondary"></a>
      </div>
    </div>
  </section>

  <!-- ABOUT -->
  <section id="about">
    <div class="wrap">
      <div class="section-head">
        <p class="section-kicker" data-i18n="about_kicker"></p>
        <h2 data-i18n="about_h"></h2>
      </div>
      <div class="about-grid">
        <div class="about-photo">
          <div class="about-photo-label" data-i18n="photo_label"></div>
        </div>
        <div class="about-body">
          <h3 data-i18n="about_name"></h3>
          <p data-i18n="about_p1"></p>
          <p data-i18n="about_p2"></p>
          <p data-i18n="about_p3"></p>
          <div class="about-tags">
            <span class="tag" data-i18n="tag1"></span>
            <span class="tag" data-i18n="tag2"></span>
            <span class="tag" data-i18n="tag3"></span>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- PRICES -->
  <section id="prices">
    <div class="wrap">
      <div class="section-head">
        <p class="section-kicker" data-i18n="prices_kicker"></p>
        <h2 data-i18n="prices_h"></h2>
        <p data-i18n="prices_lead"></p>
      </div>
      <div class="badge-ua" data-i18n="discount"></div>
      <div class="prices-grid" id="priceGrid"></div>
      <p class="prices-note" data-i18n="prices_note"></p>
    </div>
  </section>

  <!-- SPACE -->
  <section id="space">
    <div class="wrap">
      <div class="section-head">
        <p class="section-kicker" data-i18n="space_kicker"></p>
        <h2 data-i18n="space_h"></h2>
        <p data-i18n="space_lead"></p>
      </div>
      <div class="space-grid">
        <article class="space-item">
          <div class="space-thumb" data-i18n="ph_room"></div>
          <h3 data-i18n="cap_room"></h3>
          <p data-i18n="desc_room"></p>
        </article>
        <article class="space-item">
          <div class="space-thumb" data-i18n="ph_candles"></div>
          <h3 data-i18n="cap_candles"></h3>
          <p data-i18n="desc_candles"></p>
        </article>
        <article class="space-item">
          <div class="space-thumb" data-i18n="ph_cards"></div>
          <h3 data-i18n="cap_cards"></h3>
          <p data-i18n="desc_cards"></p>
        </article>
      </div>
    </div>
  </section>

  <!-- CONTACT -->
  <section id="contact" class="contact">
    <div class="wrap">
      <div class="section-head">
        <p class="section-kicker" data-i18n="contact_kicker"></p>
        <h2 data-i18n="contact_h"></h2>
        <p data-i18n="contact_lead"></p>

let lang = "uk";

function setLangButtons() {
  document.querySelectorAll(".lang button").forEach(b => {
    b.setAttribute("aria-pressed", b.dataset.lang === lang ? "true" : "false");
  });
}

function render() {
  const t = T[lang];
  document.documentElement.lang = lang;

  document.querySelectorAll("[data-i18n]").forEach(el => {
    const key = el.dataset.i18n;
    const val = t[key];
    if (val == null) return;
    el.innerHTML = val;
  });

  setLangButtons();

  const grid = document.getElementById("priceGrid");
  grid.innerHTML = SERVICES.map(s => {
    const c = t[s.id];
    const priceBlock = lang === "uk"
      ? `<div class="card-price">${s.uah} ₴</div><span class="card-old">${s.uahOld} ₴</span>`
      : `<div class="card-price">€${s.eur}</div><span class="card-old" style="visibility:hidden">—</span>`;
    return `
      <article class="card${s.featured ? " featured" : ""}">
        <h3 class="card-title">${c.n}</h3>
        <p class="card-dur">${c.d}</p>
        <ul>${c.l.map(i => `<li>${i}</li>`).join("")}</ul>
        ${priceBlock}
        <a class="btn ${s.featured ? "btn-gold" : "btn-outline"}" href="#contact">${t.book}</a>
      </article>`;
  }).join("");

  try { localStorage.setItem("km_lang", lang); } catch (e) {}
}

document.querySelectorAll(".lang button").forEach(b => {
  b.addEventListener("click", () => {
    lang = b.dataset.lang;
    render();
  });
});

const burger = document.getElementById("burger");
const mobileNav = document.getElementById("mobileNav");
burger.addEventListener("click", () => {
  const open = burger.getAttribute("aria-expanded") === "true";
  burger.setAttribute("aria-expanded", String(!open));
  mobileNav.classList.toggle("open", !open);
});
mobileNav.querySelectorAll("a").forEach(a => {
  a.addEventListener("click", () => {
    burger.setAttribute("aria-expanded", "false");
    mobileNav.classList.remove("open");
  });
});

try {
  lang = localStorage.getItem("km_lang") ||
    ((navigator.language || "").toLowerCase().startsWith("uk") ? "uk" : "en");
} catch (e) {}
