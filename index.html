<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kristel Magician · Таро, ангели, руни та езотеричні сесії</title>
<meta name="description" content="13 років практики, 500+ клієнтів. Глибокі онлайн-сесії: інтуїція, Таро, ангели, руни, Рейки.">
<meta name="theme-color" content="#04070D">
<meta property="og:title" content="Kristel Magician · Таро та езотеричні сесії">
<meta property="og:description" content="13 років практики, 500+ клієнтів. Глибокі онлайн-сесії.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#04070D;--lav:#A596D8;--lav-soft:#CFC6EE;--lav-deep:#5B4A9E;--rasp:#C2336F;--rasp-b:#EC5C93;--teal:#2FB5B0;--teal-b:#72EADD;
  --ink:#F2EFF9;--muted:#A9A8C6;--card:rgba(22,17,42,.55);--line:rgba(165,150,216,.18);--line-s:rgba(165,150,216,.38);
  --display:"Cinzel",Georgia,serif;--serif:"Cormorant Garamond",Georgia,serif;--sans:"Inter",system-ui,sans-serif;
  --r:18px;--hh:68px;--ease:cubic-bezier(.22,.8,.24,1);
  /* >>> CARD BACK PATTERN: when your pattern is ready, put the file in the repo and set e.g. url("card-back.png") <<< */
  --card-back-image:none;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:80px}
body{background:var(--bg);color:var(--ink);font:400 16px/1.65 var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}ul{list-style:none}
:focus-visible{outline:2px solid var(--teal-b);outline-offset:3px;border-radius:6px}
#stars{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.aurora{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse 70% 45% at 50% -10%,rgba(120,95,200,.34),transparent 62%),radial-gradient(ellipse 50% 40% at 100% 40%,rgba(194,51,111,.13),transparent 60%),radial-gradient(ellipse 60% 45% at 0% 100%,rgba(47,181,176,.17),transparent 62%)}
.wrap{width:min(1140px,100% - 40px);margin-inline:auto;position:relative;z-index:1}
.header{position:fixed;inset:0 0 auto 0;z-index:100;height:var(--hh);display:flex;align-items:center;border-bottom:1px solid transparent;transition:.35s}
.header.sc{background:rgba(4,7,13,.8);backdrop-filter:blur(18px);border-color:var(--line)}
.header .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px}
.logo{font-family:var(--display);font-size:15px;letter-spacing:.18em;text-transform:uppercase}
.logo i{font-style:normal;color:var(--rasp-b);margin-right:8px}
.logo span{background:linear-gradient(90deg,var(--lav-soft),var(--rasp-b));-webkit-background-clip:text;background-clip:text;color:transparent}
.nav{display:flex;align-items:center;gap:24px}
.nav a{font-size:12px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);transition:color .2s}
.nav a:hover{color:var(--lav-soft)}
.lang{display:flex;border:1px solid var(--line-s);border-radius:999px;overflow:hidden}
.lang button{padding:5px 12px;font-size:11px;font-weight:500;color:var(--muted)}
.lang button[aria-pressed=true]{background:linear-gradient(135deg,var(--lav-deep),var(--rasp));color:#fff}
.burger{display:none;width:42px;height:42px;place-items:center;border:1px solid var(--line-s);border-radius:10px;font-size:18px}
.mnav{position:fixed;top:var(--hh);left:0;right:0;z-index:99;background:rgba(4,7,13,.97);padding:12px 24px 24px;display:none;flex-direction:column}
.mnav.open{display:flex}
.mnav a{padding:14px 4px;font-size:14px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line)}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:15px 30px;font-size:12px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;border-radius:999px;border:1px solid transparent;transition:.25s var(--ease)}
.btn:hover{transform:translateY(-2px)}
.btn-p{background:linear-gradient(120deg,#a62a5f,var(--rasp-b));color:#fff;box-shadow:0 6px 30px rgba(194,51,111,.38)}
.btn-o{border-color:var(--line-s);color:var(--lav-soft)}
.btn-o:hover{border-color:var(--teal-b);color:var(--teal-b);background:rgba(47,181,176,.07)}
.hero{position:relative;z-index:1;min-height:100svh;display:flex;align-items:center;padding:calc(var(--hh) + 36px) 0 70px}
.hero .wrap{display:grid;grid-template-columns:1.05fr .95fr;gap:44px;align-items:center}
.eyebrow{font-size:11px;font-weight:500;letter-spacing:.28em;text-transform:uppercase;color:var(--teal-b);margin-bottom:24px}
.hero h1{font-family:var(--display);font-weight:400;font-size:clamp(2.2rem,5.3vw,4rem);line-height:1.1;letter-spacing:.05em;text-transform:uppercase;margin-bottom:24px}
.hero h1 em{font-style:normal;background:linear-gradient(100deg,var(--lav),var(--rasp-b),#ffd6e6,var(--teal-b),var(--lav));background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 9s linear infinite}
@keyframes sh{to{background-position:-300% 0}}
.lead{font-family:var(--serif);font-size:clamp(1.15rem,2.2vw,1.4rem);color:var(--muted);max-width:42ch;margin-bottom:34px}
.acts{display:flex;flex-wrap:wrap;gap:14px;margin-bottom:34px}
.facts{display:flex;flex-wrap:wrap;gap:10px 26px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.facts span::before{content:"✦";color:var(--rasp-b);margin-right:8px;font-size:9px}
.portal{position:relative;max-width:420px;width:100%;margin-inline:auto;aspect-ratio:3/4;border-radius:200px 200px 18px 18px;border:1px solid var(--line-s);background:radial-gradient(circle at 50% 38%,rgba(236,92,147,.35),transparent 40%),linear-gradient(170deg,rgba(165,150,216,.34),rgba(60,40,110,.4) 55%,rgba(8,12,24,.9));box-shadow:0 0 80px rgba(91,74,158,.45);display:grid;place-items:center;overflow:hidden}
.portal::before{content:"";position:absolute;inset:14px;border-radius:188px 188px 10px 10px;border:2px dotted rgba(236,92,147,.55)}
.portal::after{content:"";position:absolute;width:300%;height:300%;background:repeating-conic-gradient(from 0deg at 50% 38%,rgba(236,92,147,.16) 0 4deg,transparent 4deg 15deg);animation:spin 160s linear infinite;mask:radial-gradient(circle at 50% 38%,#000,transparent 45%);-webkit-mask:radial-gradient(circle at 50% 38%,#000,transparent 45%)}
@keyframes spin{to{transform:rotate(360deg)}}
.portal b{position:relative;z-index:2;font-size:84px;color:#ffd6e6;filter:drop-shadow(0 0 22px rgba(236,92,147,.9));margin-top:-80px;animation:pl 4s ease-in-out infinite}
@keyframes pl{50%{opacity:.65;transform:scale(.93)}}
section.s{position:relative;z-index:1;padding:90px 0}
.sh{text-align:center;margin-bottom:52px}
.kick{font-size:11px;font-weight:500;letter-spacing:.26em;text-transform:uppercase;color:var(--teal-b);margin-bottom:14px}
.kick::before,.kick::after{content:" ✦ ";font-size:9px;color:var(--rasp-b)}
.sh h2{font-family:var(--display);font-weight:400;font-size:clamp(1.7rem,3.8vw,2.5rem);letter-spacing:.08em;text-transform:uppercase;margin-bottom:14px}
.sh p{color:var(--muted);max-width:54ch;margin-inline:auto}
.about{display:grid;grid-template-columns:320px 1fr;gap:64px;align-items:center;max-width:1000px;margin-inline:auto}
.arch{aspect-ratio:3/4;border-radius:200px 200px 18px 18px;border:1px solid var(--line-s);background:linear-gradient(170deg,rgba(165,150,216,.34),rgba(60,40,110,.4) 55%,rgba(8,12,24,.9));display:grid;place-items:center;text-align:center;color:var(--lav-soft);font-size:13px;box-shadow:0 0 70px rgba(91,74,158,.4)}
.about h3{font-family:var(--serif);font-style:italic;font-weight:500;font-size:2.1rem;margin-bottom:16px;background:linear-gradient(90deg,var(--lav-soft),var(--rasp-b));-webkit-background-clip:text;background-clip:text;color:transparent;width:fit-content}
.about p{color:var(--muted);margin-bottom:14px;line-height:1.8;max-width:56ch}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;max-width:900px;margin:68px auto 0}
.stat{text-align:center;padding:26px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--card)}
.stat b{display:block;font-family:var(--display);font-weight:500;font-size:clamp(2rem,4vw,2.8rem);line-height:1.1;background:linear-gradient(120deg,var(--lav-soft),var(--rasp-b));-webkit-background-clip:text;background-clip:text;color:transparent}
.stat span{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.tl{position:relative;max-width:760px;margin-inline:auto;padding-left:52px}
.tl::before{content:"";position:absolute;left:15px;top:8px;bottom:8px;width:2px;background:linear-gradient(180deg,var(--rasp-b),var(--lav),var(--teal-b));opacity:.7}
.tl-i{position:relative;padding-bottom:36px}.tl-i:last-child{padding-bottom:0}
.tl-i::before{content:"";position:absolute;left:-45px;top:6px;width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,var(--rasp-b) 45%,#8a1f4c);box-shadow:0 0 0 5px var(--bg),0 0 22px rgba(236,92,147,.7)}
.tl-i:nth-child(even)::before{background:radial-gradient(circle at 35% 35%,#fff,var(--teal-b) 45%,#1c7f7b);box-shadow:0 0 0 5px var(--bg),0 0 22px rgba(114,234,221,.7)}
.tl-k{font-family:var(--display);font-size:12px;letter-spacing:.26em;text-transform:uppercase;color:var(--teal-b)}
.tl-i h3{font-family:var(--serif);font-weight:600;font-size:1.6rem;margin:4px 0 6px}
.tl-i p{color:var(--muted);max-width:54ch}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.box{padding:28px 22px;background:var(--card);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:var(--r);transition:.3s var(--ease)}
.box:hover{border-color:rgba(114,234,221,.45);transform:translateY(-5px);box-shadow:0 18px 50px rgba(47,181,176,.14)}
.box .g{font-size:30px;line-height:1;color:var(--rasp-b);margin-bottom:14px;display:block}
.box:nth-child(even) .g{color:var(--teal-b)}
.box h3{font-family:var(--serif);font-weight:600;font-size:1.3rem;line-height:1.2;margin-bottom:8px}
.box p{font-size:14.5px;color:var(--muted)}
.steps{counter-reset:s}.steps .box{position:relative}
.steps .box::before{counter-increment:s;content:"0" counter(s);font-family:var(--display);font-size:2rem;color:var(--rasp-b);display:block;margin-bottom:10px}
.quote{text-align:center;padding:30px 0}
.quote blockquote{font-family:var(--serif);font-style:italic;font-weight:500;font-size:clamp(1.6rem,3.8vw,2.6rem);line-height:1.35;max-width:24em;margin-inline:auto;background:linear-gradient(110deg,var(--lav-soft),#fff 40%,var(--rasp-b) 70%,var(--teal-b));-webkit-background-clip:text;background-clip:text;color:transparent}
.badge{width:fit-content;margin:-24px auto 34px;padding:6px 16px;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--teal-b);border:1px solid rgba(114,234,221,.4);border-radius:999px}
.prices{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.pc{position:relative;display:flex;flex-direction:column;padding:36px 26px 26px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);transition:.3s var(--ease)}
.pc:hover{border-color:var(--line-s);transform:translateY(-6px);box-shadow:0 20px 56px rgba(91,74,158,.35)}
.pc.f{border-color:rgba(236,92,147,.55);background:linear-gradient(170deg,rgba(194,51,111,.16),var(--card) 55%)}
.rib{position:absolute;top:-12px;left:50%;translate:-50% 0;background:linear-gradient(135deg,var(--rasp),var(--rasp-b));font-size:10px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;padding:5px 14px;border-radius:999px;white-space:nowrap}
.pc h3{font-family:var(--serif);font-weight:600;font-size:1.55rem}
.pc .d{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--lav);margin-bottom:18px}
.pc ul{flex:1;margin-bottom:22px}
.pc li{position:relative;padding-left:20px;margin-bottom:10px;font-size:14.5px;color:var(--muted)}
.pc li::before{content:"✧";position:absolute;left:0;color:var(--teal-b);font-size:11px}
.pr{font-family:var(--display);font-size:2.1rem;font-weight:500;background:linear-gradient(110deg,var(--lav-soft),var(--rasp-b));-webkit-background-clip:text;background-clip:text;color:transparent;width:fit-content}
.old{display:block;font-size:13px;color:var(--muted);text-decoration:line-through;opacity:.6;margin:4px 0 16px;min-height:20px}
.pc .btn{width:100%;padding:13px 16px;font-size:11px}
.note{text-align:center;margin-top:26px;font-size:13px;color:var(--muted)}
/* DRAW */
.draw{display:grid;grid-template-columns:auto 1fr;gap:56px;align-items:center;max-width:960px;margin-inline:auto}
.flip{width:320px;aspect-ratio:2/3.4;perspective:1400px;cursor:pointer}
.fi{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform 1.1s var(--ease)}
.flip.open .fi{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:20px;border:1px solid var(--line-s);box-shadow:0 28px 80px rgba(0,0,0,.6),0 0 70px rgba(91,74,158,.45);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:22px}
.back{background:var(--card-back-image) center/cover,radial-gradient(circle,rgba(236,92,147,.3),transparent 46%),repeating-linear-gradient(45deg,rgba(236,92,147,.12) 0 2px,transparent 2px 13px),linear-gradient(165deg,#4b3a8d,#1a1236 70%)}
.back::before,.front::before{content:"";position:absolute;inset:12px;border:2px dotted rgba(236,92,147,.6);border-radius:12px}
.back .sig{font-size:64px;color:#ffd6e6;filter:drop-shadow(0 0 18px rgba(236,92,147,.9));animation:pl 3.4s ease-in-out infinite}
.front{transform:rotateY(180deg);background:radial-gradient(circle at 50% 30%,rgba(114,234,221,.18),transparent 55%),linear-gradient(165deg,#2c2060,#0a1019)}
.front::before{border-color:rgba(114,234,221,.45)}
.front .num{font-family:var(--display);font-size:15px;letter-spacing:.34em;color:var(--teal-b)}
.front .gl{font-size:86px;line-height:1;color:var(--rasp-b);filter:drop-shadow(0 0 22px rgba(236,92,147,.7))}
.front .nm{font-family:var(--display);font-size:18px;letter-spacing:.18em;text-transform:uppercase}
.front .kw{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--lav)}
.dt h3{font-family:var(--serif);font-style:italic;font-weight:500;font-size:2.4rem;line-height:1.15;background:linear-gradient(90deg,var(--lav-soft),var(--rasp-b));-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:10px;display:inline-block}
.dt p{color:var(--muted);margin-bottom:12px;max-width:46ch}
.dt .adv{padding:14px 18px;border-left:2px solid var(--teal-b);background:rgba(47,181,176,.07);color:var(--ink);border-radius:0 12px 12px 0}
.dt .adv small{display:block;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--teal-b)}
.dt .acts{margin:22px 0 0}
.faq{max-width:780px;margin-inline:auto}
.faq details{border-bottom:1px solid var(--line)}
.faq summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;gap:20px;padding:22px 4px;font-family:var(--serif);font-size:1.3rem;font-weight:500}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";color:var(--rasp-b);font-size:1.6rem;font-family:var(--sans);font-weight:300;transition:.3s}
.faq details[open] summary::after{transform:rotate(45deg)}
.faq .ans{padding:0 4px 22px;color:var(--muted);max-width:62ch}
.rv .stars{color:var(--rasp-b);letter-spacing:.2em;margin-bottom:10px;font-size:14px}
.rv em{display:block;font-family:var(--serif);font-size:1.2rem;line-height:1.5;margin-bottom:14px}
.rv small{color:var(--muted);font-size:12px;letter-spacing:.1em;text-transform:uppercase}
.cta{text-align:center;padding:72px 28px;border:1px solid var(--line-s);border-radius:30px;background:radial-gradient(ellipse 80% 90% at 50% 0%,rgba(120,95,200,.34),rgba(10,16,25,.75) 70%),radial-gradient(ellipse 60% 50% at 50% 120%,rgba(47,181,176,.22),transparent 70%)}
.cta h2{font-family:var(--display);font-weight:400;font-size:clamp(1.6rem,4vw,2.5rem);letter-spacing:.08em;text-transform:uppercase;margin:14px 0}
.cta .lead{margin:0 auto 28px}
.cta .acts{justify-content:center;margin:0}
.course{border-color:rgba(114,234,221,.4)}
.footer{position:relative;z-index:1;padding:34px 0 44px;border-top:1px solid var(--line);text-align:center;font-size:12px;letter-spacing:.08em;color:var(--muted)}
.js .fade{opacity:0;transform:translateY(26px);transition:opacity .9s var(--ease),transform .9s var(--ease)}
.js .fade.in{opacity:1;transform:none}
@media(max-width:1000px){.grid4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:920px){
  .nav{display:none}.burger{display:grid}
  .hero{min-height:auto}.hero .wrap{grid-template-columns:1fr;text-align:center}
  .lead{margin-inline:auto}.acts,.facts{justify-content:center}
  .portal{max-width:300px;order:-1}
  .about{grid-template-columns:1fr;text-align:center;gap:40px}.arch{max-width:260px;margin-inline:auto}.about p,.about h3{margin-inline:auto}
  .prices{grid-template-columns:1fr;max-width:420px;margin-inline:auto}
  .draw{grid-template-columns:1fr;justify-items:center;text-align:center;gap:34px}.dt .adv{text-align:left}
  section.s{padding:68px 0}
}
@media(max-width:560px){.wrap{width:calc(100% - 28px)}.grid4,.stats{grid-template-columns:1fr}.flip{width:270px}.tl{padding-left:44px}.tl-i::before{left:-37px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition-duration:.01ms!important}.js .fade{opacity:1;transform:none}}
</style>
</head>
<body>
<canvas id="stars" aria-hidden="true"></canvas><div class="aurora" aria-hidden="true"></div>
<header class="header" id="hd"><div class="wrap">
  <a class="logo" href="#top"><i>✦</i>Kristel <span>Magician</span></a>
  <nav class="nav" aria-label="Main">
    <a href="#about" data-i="nav_about"></a><a href="#practices" data-i="nav_prac"></a><a href="#prices" data-i="nav_prices"></a><a href="#draw" data-i="nav_draw"></a><a href="#reviews" data-i="nav_rev"></a><a href="#contact" data-i="nav_contact"></a>
    <div class="lang"><button data-lang="uk" aria-pressed="true">UA</button><button data-lang="en" aria-pressed="false">EN</button></div>
  </nav>
  <button class="burger" id="bg" aria-label="Menu" aria-expanded="false">☰</button>
</div></header>
<nav class="mnav" id="mn">
  <a href="#about" data-i="nav_about"></a><a href="#practices" data-i="nav_prac"></a><a href="#prices" data-i="nav_prices"></a><a href="#draw" data-i="nav_draw"></a><a href="#reviews" data-i="nav_rev"></a><a href="#contact" data-i="nav_contact"></a>
  <div class="lang" style="margin-top:16px;align-self:flex-start"><button data-lang="uk" aria-pressed="true">UA</button><button data-lang="en" aria-pressed="false">EN</button></div>
</nav>

<main id="top">
<section class="hero"><div class="wrap">
  <div>
    <p class="eyebrow" data-i="eyebrow"></p>
    <h1 data-i="h1"></h1>
    <p class="lead" data-i="hero_lead"></p>
    <div class="acts"><a class="btn btn-p" href="#prices" data-i="cta1"></a><a class="btn btn-o" href="#draw" data-i="cta2"></a></div>
    <div class="facts"><span data-i="f1"></span><span data-i="f2"></span><span data-i="f3"></span></div>
  </div>
  <div class="portal" aria-hidden="true"><b>✦</b></div>
</div></section>

<section class="s" id="about"><div class="wrap">
  <div class="sh fade"><p class="kick" data-i="about_k"></p><h2 data-i="about_h"></h2></div>
  <div class="about">
    <div class="arch fade"><span data-i="photo"></span></div>
    <div class="fade">
      <h3>Kristel Magician</h3>
      <p data-i="a1"></p><p data-i="a2"></p><p data-i="a3"></p>
    </div>
  </div>
  <div class="stats" id="stats"></div>
</div></section>

<section class="s" id="path" style="padding-top:20px"><div class="wrap">

let lang="uk",cur=null;
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const PG=["✺","✦","☿","✧","❂","ᚱ","ᚲ","☉"];

function renderDraw(){
  const t=T[lang],o=cur!==null;
  $("flip").classList.toggle("open",o);
  $("flip").setAttribute("aria-label",t.d_btn);
  $("db").textContent=o?t.d_again:t.d_btn;
  $("da").hidden=!o;
  if(o){const c=CARDS[cur],x=t.cards[cur];
    $("dn").textContent=c[0];$("dg").textContent=c[1];$("dnm").textContent=x[0];$("dk").textContent=x[1];
    $("dt").textContent=x[0];$("dm").textContent=x[2];$("dav").textContent=x[3];
  }else{$("dt").textContent=t.d_idle;$("dm").textContent=t.d_idle_p;}
}
function drawCard(){
  const f=$("flip"),was=cur!==null;
  const pick=()=>{let n;do{n=Math.floor(Math.random()*CARDS.length)}while(n===cur);cur=n;renderDraw()};
  if(was){f.classList.remove("open");setTimeout(pick,650)}else pick();
}

const io="IntersectionObserver" in window?new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}}),{threshold:.1}):null;
function obs(){document.querySelectorAll(".fade:not(.in)").forEach(el=>io?io.observe(el):el.classList.add("in"))}

function render(){
  const t=T[lang];
  document.documentElement.lang=lang;
  document.querySelectorAll("[data-i]").forEach(el=>{const v=t[el.dataset.i];if(typeof v==="string")el.innerHTML=v});
  document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===lang));
  $("stats").innerHTML=t.stats.map(s=>`<div class="stat fade"><b>${esc(s.n)}</b><span>${esc(s.l)}</span></div>`).join("");
  $("tl").innerHTML=t.path.map(p=>`<div class="tl-i fade"><div class="tl-k">${esc(p.k)}</div><h3>${esc(p.t)}</h3><p>${esc(p.p)}</p></div>`).join("");
  $("prac").innerHTML=t.prac.map((p,i)=>`<article class="box fade"><span class="g" aria-hidden="true">${PG[i]}\uFE0E</span><h3>${esc(p.t)}</h3><p>${esc(p.p)}</p></article>`).join("");
  $("steps").innerHTML=t.steps.map(p=>`<article class="box fade"><h3>${esc(p.t)}</h3><p>${esc(p.p)}</p></article>`).join("");
  $("revs").innerHTML=t.revs.map(r=>`<article class="box rv fade"><div class="stars">★★★★★</div><em>${esc(r.q)}</em><small>${esc(r.n)}</small></article>`).join("");
  const b=$("badge");b.textContent=t.disc;b.style.display=t.disc?"block":"none";
  $("pgrid").innerHTML=SERVICES.map(s=>{
    const c=t[s.id];
    const price=lang==="uk"?`<div class="pr">${s.uah} ₴</div><span class="old">${s.uahOld} ₴</span>`:`<div class="pr">€${s.eur}</div><span class="old"></span>`;
    return `<article class="pc fade${s.featured?" f":""}">${s.featured?`<span class="rib">${esc(t.popular)}</span>`:""}<h3>${esc(c.n)}</h3><p class="d">${esc(c.d)}</p><ul>${c.l.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>${price}<a class="btn ${s.featured?"btn-p":"btn-o"}" href="#contact">${esc(t.book)}</a></article>`;
  }).join("");
  $("faqL").innerHTML=t.faq.map(f=>`<details><summary>${esc(f.q)}</summary><p class="ans">${esc(f.a)}</p></details>`).join("");
  renderDraw();obs();
  try{localStorage.setItem("km_lang",lang)}catch(e){}
}

document.querySelectorAll(".lang button").forEach(b=>b.addEventListener("click",()=>{lang=b.dataset.lang;render()}));
const bg=$("bg"),mn=$("mn");
bg.addEventListener("click",()=>{const o=mn.classList.toggle("open");bg.setAttribute("aria-expanded",o)});
mn.querySelectorAll("a").forEach(a=>a.addEventListener("click",()=>{mn.classList.remove("open");bg.setAttribute("aria-expanded","false")}));
$("db").addEventListener("click",drawCard);
$("flip").addEventListener("click",()=>{if(cur===null)drawCard()});
$("flip").addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();drawCard()}});
const hd=$("hd"),onS=()=>hd.classList.toggle("sc",scrollY>24);
addEventListener("scroll",onS,{passive:true});onS();

(function(){
  const cv=$("stars"),ctx=cv.getContext("2d"),reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  const dpr=Math.min(devicePixelRatio||1,2),C=["207,198,238","207,198,238","114,234,221","236,92,147"];
  let w,h,S=[];
  function size(){w=innerWidth;h=innerHeight;cv.width=w*dpr;cv.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
    S=Array.from({length:Math.round(w*h/9000)},()=>({x:Math.random()*w,y:Math.random()*h,r:Math.random()*1.2+.2,p:Math.random()*6.28,s:Math.random()*.02+.005,c:C[Math.floor(Math.random()*4)]}))}
  function frame(t){ctx.clearRect(0,0,w,h);for(const s of S){ctx.fillStyle=`rgba(${s.c},${.25+.6*(.5+.5*Math.sin(s.p+t*s.s*.06))})`;ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,6.283);ctx.fill()}if(!reduce)requestAnimationFrame(frame)}
  size();addEventListener("resize",size);requestAnimationFrame(frame);
})();

try{lang=localStorage.getItem("km_lang")||((navigator.language||"").toLowerCase().startsWith("uk")?"uk":"en")}catch(e){}
render();
</script>
