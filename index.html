<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kristel Magician · Таро та езотеричні консультації</title>
<meta name="description" content="Таро та езотеричні консультації онлайн. Kristel Magician.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg-dark: #1a1424;
  --bg-mid: #241c32;
  --bg-light: #f4f0f5;
  --ink-dark: #f0e8f4;
  --ink-light: #2a2438;
  --muted-dark: #b8a8c8;
  --muted-light: #6a6080;
  --purple: #6b4a8a;
  --purple-deep: #4a3068;
  --lavender: #c4a8e0;
  --green: #3d8a6a;
  --green-soft: #5aad88;
  --gold: #c9a86c;
  --gold-bright: #e0c48a;
  --serif: "Cormorant Garamond", Georgia, serif;
  --sans: "Jost", system-ui, sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  background: var(--bg-dark);
  color: var(--ink-dark);
  font: 15.5px/1.55 var(--sans);
  font-weight: 300;
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; text-decoration: none; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }

.wrap { max-width: 920px; margin: 0 auto; padding: 0 22px; }

/* header */
header {
  position: absolute;
  top: 0; left: 0; right: 0;
  z-index: 20;
  padding: 14px 0;
}
header .wrap {
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.logo {
  font: 500 13px/1 var(--sans);
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: rgba(240, 232, 244, 0.9);
}
nav {
  display: flex;
  gap: 22px;
  align-items: center;
  font-size: 11px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}
nav a { color: rgba(240, 232, 244, 0.7); transition: color 0.2s; }
nav a:hover { color: #fff; }
.lang {
  display: flex;
  border: 1px solid rgba(196, 168, 224, 0.3);
  border-radius: 2px;
  overflow: hidden;
}
.lang button {
  background: none;
  border: 0;
  color: rgba(240, 232, 244, 0.65);
  padding: 3px 9px;
  font: 400 10px var(--sans);
  letter-spacing: 0.06em;
  cursor: pointer;
}
.lang button[aria-pressed="true"] {
  background: rgba(196, 168, 224, 0.25);
  color: #fff;
}

/* HERO — compact */
.hero {
  position: relative;
  min-height: 56vh;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 72px 22px 48px;
  background:
    linear-gradient(180deg, rgba(26, 20, 36, 0.5) 0%, rgba(26, 20, 36, 0.8) 70%, var(--bg-dark) 100%),
    radial-gradient(ellipse 80% 60% at 50% 40%, rgba(107, 74, 138, 0.3), transparent 70%);
}
.hero::before {
  content: "";
  position: absolute;
  inset: 0;
  background:
    radial-gradient(circle at 18% 28%, rgba(61, 138, 106, 0.1), transparent 38%),
    radial-gradient(circle at 82% 65%, rgba(196, 168, 224, 0.08), transparent 32%);
  pointer-events: none;
}
.hero-inner { position: relative; z-index: 1; max-width: 560px; }
.hero-stars {
  color: var(--gold-bright);
  font-size: 12px;
  letter-spacing: 12px;
  margin-bottom: 14px;
  opacity: 0.85;
}
h1 {
  font: 400 clamp(32px, 5.5vw, 48px)/1.1 var(--serif);
  letter-spacing: 0.04em;
  text-transform: uppercase;
  margin: 0 0 12px;
  color: #fff;
}
.hero-sub {
  font: italic 400 15px/1.45 var(--serif);
  color: var(--lavender);
  margin: 0 0 24px;
  opacity: 0.9;
}
.btn {
  display: inline-block;
  font: 400 11px/1 var(--sans);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  padding: 11px 22px;
  border: 1px solid rgba(255,255,255,0.45);
  color: #fff;
  background: transparent;
  transition: all 0.2s;
  border-radius: 1px;
}
.btn:hover {
  background: rgba(255,255,255,0.1);
  border-color: #fff;
}
.btn-dark {
  background: var(--purple-deep);
  border-color: var(--purple-deep);
  color: #f0e8f4;
}
.btn-dark:hover {
  background: var(--purple);
  border-color: var(--purple);
}
.btn-light {
  background: var(--ink-light);
  border-color: var(--ink-light);
  color: #fff;
}
.btn-light:hover {
  background: #3a3450;
}
.btn-gold {
  background: transparent;
  border-color: var(--gold);
  color: var(--gold-bright);
}
.btn-gold:hover {
  background: rgba(201, 168, 108, 0.12);
}

/* ABOUT — light, compact */
.about {
  background: var(--bg-light);
  color: var(--ink-light);
  padding: 48px 0;
}
.about-grid {
  display: grid;
  grid-template-columns: 180px 1fr;
  gap: 32px;
  align-items: center;
  max-width: 720px;
  margin: 0 auto;
}
.photo-frame {
  position: relative;
  aspect-ratio: 3/4;
  border: 1.5px solid #c8bdd8;
  border-radius: 100px 100px 6px 6px;
  padding: 7px;
  background: #fff;
}
.photo-frame::before,
.photo-frame::after {
  content: "✦";
  position: absolute;
  color: var(--purple);
  font-size: 10px;
  opacity: 0.5;
}
.photo-frame::before { top: 12px; left: -5px; }
.photo-frame::after { bottom: 16px; right: -5px; }
.photo-inner {
  width: 100%;
  height: 100%;
  border-radius: 94px 94px 3px 3px;
  background: #e8e0f0;
  display: grid;
  place-items: center;
  color: var(--muted-light);
  font-size: 12px;
  text-align: center;
  padding: 12px;
}
.about-label {
  font-size: 10px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--purple);
  margin-bottom: 6px;
}
.about h2 {
  font: 400 26px/1.15 var(--serif);
  letter-spacing: 0.03em;
  text-transform: uppercase;
  margin: 0 0 12px;
  color: var(--ink-light);
}
.about p {
  color: var(--muted-light);
  font-size: 14px;
  line-height: 1.6;
  margin-bottom: 8px;
  max-width: 40ch;
}
.about .btn { margin-top: 8px; }

/* PRICES — dark, compact */
.prices-sec {
  background: var(--bg-mid);
  padding: 48px 0 44px;
  text-align: center;
}
.prices-sec h2 {
  font: 400 26px/1.15 var(--serif);
  letter-spacing: 0.05em;
  text-transform: uppercase;
  margin: 0 0 6px;
  color: var(--ink-dark);
}
.prices-sec .lead {
  color: var(--muted-dark);
  max-width: 38ch;
  margin: 0 auto 10px;
  font-size: 13.5px;
}
.badge {
  display: none;
  margin: 0 auto 24px;
  width: fit-content;
  font-size: 9px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--green-soft);
  border: 1px solid rgba(61, 138, 106, 0.4);
  padding: 4px 12px;
}
html[lang="uk"] .badge { display: block; }

.prices {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 14px;
  max-width: 820px;
  margin: 0 auto;
}
.card {
  background: rgba(26, 20, 36, 0.55);
  border: 1px solid rgba(196, 168, 224, 0.14);
  border-radius: 80px 80px 6px 6px;
  padding: 24px 16px 20px;
  display: flex;
  flex-direction: column;
  transition: border-color 0.2s, box-shadow 0.2s;
}
.card:hover {
  border-color: rgba(196, 168, 224, 0.32);
  box-shadow: 0 6px 28px rgba(107, 74, 138, 0.12);
}
.card.feat {
  border-color: rgba(201, 168, 108, 0.4);
  position: relative;
}
.card.feat::before {
  content: "✦";
  position: absolute;
  top: 10px;
  left: 50%;
  transform: translateX(-50%);
  color: var(--gold);
  font-size: 11px;
}
.card h3 {
  font: 500 18px/1.2 var(--serif);
  margin: 4px 0 4px;
  color: var(--ink-dark);
}
.dur {
  color: var(--green-soft);
  font-size: 10px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  margin: 0 0 10px;
}
.card ul {
  list-style: none;
  margin: 0 0 14px;
  padding: 0;
  color: var(--muted-dark);
  font-size: 12.5px;
  flex: 1;
  line-height: 1.7;
}
.card ul li::before {
  content: "· ";
  color: var(--lavender);
}
.price {
  font: 500 24px/1 var(--serif);
  color: var(--gold-bright);
  margin-bottom: 1px;
}
.old {
  color: var(--muted-dark);
  text-decoration: line-through;
  font-size: 11.5px;
  opacity: 0.55;
  display: block;
  margin-bottom: 12px;
}
.card .btn {
  margin-top: auto;
  font-size: 10px;
  padding: 9px 14px;
  align-self: center;
}
.note {
  margin-top: 18px;
  color: var(--muted-dark);
  font-size: 12px;
  opacity: 0.7;
}

/* SPACE — light, compact */
.space {
  background: var(--bg-light);
  color: var(--ink-light);
  padding: 44px 0;
  text-align: center;
}
.space h2 {
  font: 400 24px/1.15 var(--serif);
  letter-spacing: 0.05em;
  text-transform: uppercase;
  margin: 0 0 6px;
}
.space .lead {
  color: var(--muted-light);
  max-width: 36ch;
  margin: 0 auto 24px;
  font-size: 13.5px;
}
.gallery {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 14px;
  max-width: 720px;
  margin: 0 auto;
}
.ph {
  aspect-ratio: 1;
  border-radius: 50% 50% 6px 6px;
  background: #e4dceb;
  border: 1.5px solid #c8bdd8;
  display: grid;
  place-items: center;
  color: var(--muted-light);
  font-size: 12px;
  padding: 12px;
  text-align: center;
}
.cap {
  margin: 8px 0 0;
  font-size: 11px;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: var(--muted-light);
}

/* CONTACT — dark, compact */
.contact {
  background: var(--bg-dark);
  padding: 44px 0 36px;
  text-align: center;
}
.contact h2 {
  font: 400 24px/1.15 var(--serif);
  letter-spacing: 0.05em;
  text-transform: uppercase;
  margin: 0 0 6px;
}
.contact .lead {
  color: var(--muted-dark);
  max-width: 34ch;
  margin: 0 auto 20px;
  font-size: 13.5px;
}
.contact-btns {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  justify-content: center;
}

footer {
  background: var(--bg-dark);
  padding: 16px 0 24px;
  border-top: 1px solid rgba(196, 168, 224, 0.1);
  color: var(--muted-dark);
  font-size: 11px;
  text-align: center;
  letter-spacing: 0.05em;
}

@media (max-width: 720px) {
  nav a { display: none; }
  .about-grid { grid-template-columns: 1fr; text-align: center; gap: 20px; }
  .photo-frame { max-width: 160px; margin: 0 auto; }
  .about p { margin-left: auto; margin-right: auto; }
  .prices, .gallery { grid-template-columns: 1fr; max-width: 280px; }
  .hero { min-height: 48vh; padding: 64px 18px 40px; }
  .about, .prices-sec, .space, .contact { padding-top: 36px; padding-bottom: 36px; }
}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <a class="logo" href="#top">Kristel Magician</a>
    <nav>
      <a href="#about" data-i18n="nav_about"></a>
      <a href="#prices" data-i18n="nav_prices"></a>
      <a href="#space" data-i18n="nav_space"></a>
      <a href="#contact" data-i18n="nav_contact"></a>
      <div class="lang" role="group" aria-label="Language">
        <button data-lang="uk" aria-pressed="true">UA</button>
        <button data-lang="en" aria-pressed="false">EN</button>
      </div>
    </nav>
  </div>
</header>

<main id="top">
  <section class="hero">
    <div class="hero-inner">
      <div class="hero-stars">✦ &nbsp; ✦ &nbsp; ✦</div>
      <h1 data-i18n="h1"></h1>
      <p class="hero-sub" data-i18n="hero_p"></p>
      <a class="btn" href="#prices" data-i18n="cta"></a>
    </div>
  </section>

  <section class="about" id="about">
    <div class="wrap">
      <div class="about-grid">
        <div class="photo-frame">
          <div class="photo-inner" data-i18n="photo"></div>
        </div>
        <div>
          <p class="about-label" data-i18n="about_label"></p>
          <h2 data-i18n="about_h"></h2>
          <p data-i18n="about_p1"></p>
          <p data-i18n="about_p2"></p>
          <a class="btn btn-light" href="#prices" data-i18n="about_cta"></a>
        </div>
      </div>
    </div>
  </section>

  <section class="prices-sec" id="prices">
    <div class="wrap">
      <h2 data-i18n="prices_h"></h2>
      <p class="lead" data-i18n="prices_lead"></p>
      <span class="badge" data-i18n="discount"></span>
      <div class="prices" id="priceGrid"></div>
      <p class="note" data-i18n="prices_note"></p>
    </div>
  </section>

  <section class="space" id="space">
    <div class="wrap">
      <h2 data-i18n="space_h"></h2>
      <p class="lead" data-i18n="space_lead"></p>
      <div class="gallery">
        <figure style="margin:0">
          <div class="ph" data-i18n="ph_room"></div>
          <figcaption class="cap" data-i18n="cap_room"></figcaption>
        </figure>
        <figure style="margin:0">
          <div class="ph" data-i18n="ph_candles"></div>
          <figcaption class="cap" data-i18n="cap_candles"></figcaption>
        </figure>
        <figure style="margin:0">
          <div class="ph" data-i18n="ph_cards"></div>
          <figcaption class="cap" data-i18n="cap_cards"></figcaption>
        </figure>
      </div>
    </div>
  </section>

  <section class="contact" id="contact">
    <div class="wrap">
      <h2 data-i18n="contact_h"></h2>
      <p class="lead" data-i18n="contact_p"></p>
      <div class="contact-btns">
        <a class="btn btn-dark" href="https://t.me/your_username">Telegram</a>
        <a class="btn btn-gold" href="https://instagram.com/your_username">Instagram</a>
        <a class="btn" href="mailto:you@example.com">Email</a>
      </div>
    </div>
  </section>
</main>

<footer>
  <div class="wrap" data-i18n="footer"></div>
</footer>

<script>
const SERVICES = [
  { id: "quick", uah: 900,  uahOld: 1600, eur: 60 },
  { id: "full",  uah: 1500, uahOld: 2700, eur: 100, featured: true },
  { id: "deep",  uah: 2200, uahOld: 3800, eur: 150 }
];

const T = {
  uk: {
    nav_about: "Про мене",
    nav_prices: "Послуги",
    nav_space: "Простір",
    nav_contact: "Контакти",
    h1: "Знайди свою<br>внутрішню магію",
    hero_p: "Таро та езотеричні консультації з Kristel Magician",
    cta: "Дізнатися більше",
    photo: "Ваше фото",
    about_label: "Ваш езотеричний гід",
    about_h: "Мене звати<br>Kristel Magician",
    about_p1: "Я працюю з картами Таро та езотеричними практиками. Тут можна коротко розповісти, як ви прийшли до цього шляху.",
    about_p2: "Опишіть свій підхід: з якими питаннями звертаються, як проходить сесія, що людина забирає з собою.",
    about_cta: "Переглянути послуги",
    prices_h: "Послуги",
    prices_lead: "Оберіть формат. Усі сесії — онлайн.",
    discount: "Знижка для України",
    prices_note: "Ціна за одну консультацію. Оплата наперед.",
    space_h: "Мій простір",
    space_lead: "Кімната, свічки і колода, з якою я працюю.",
    ph_room: "Фото кімнати",
    ph_candles: "Фото свічок",
    ph_cards: "Фото колоди",
    cap_room: "Кімната",
    cap_candles: "Свічки",
    cap_cards: "Колода",
    contact_h: "Контакти",
    contact_p: "Напишіть — підберемо зручний час.",
    footer: "© 2026 Kristel Magician",
    quick: { n: "Швидкий розклад", d: "1 питання · 3 карти", l: ["Одне питання", "Розклад на 3 карти", "Відповідь текстом або голосом"] },
    full:  { n: "Повна консультація", d: "45 хвилин", l: ["До 3 питань", "Детальний розклад", "Записи після сесії"] },
    deep:  { n: "Глибока сесія", d: "~75 хвилин", l: ["Аналіз ситуації", "Кілька розкладів", "Рекомендації та план"] },
    book: "Записатися"
  },
  en: {
    nav_about: "About",
    nav_prices: "Services",
    nav_space: "Space",
    nav_contact: "Contact",
    h1: "Find your<br>inner magic",
    hero_p: "Tarot & esoteric consultations with Kristel Magician",
    cta: "Learn more",
    photo: "Your photo",
    about_label: "Your spiritual guide",
    about_h: "My name is<br>Kristel Magician",
    about_p1: "I work with Tarot and esoteric practices. Briefly share how you came to this path.",
    about_p2: "Describe your approach: what people come for, how a session unfolds, and what they leave with.",
    about_cta: "View services",
    prices_h: "Services",
    prices_lead: "Choose a format. All sessions are online.",
    discount: "",
    prices_note: "Price per session. Payment in advance.",
    space_h: "My space",
    space_lead: "The room, candles and the deck I work with.",
    ph_room: "Room photo",
    ph_candles: "Candles photo",
    ph_cards: "Deck photo",
    cap_room: "The room",
    cap_candles: "Candles",
    cap_cards: "The deck",
    contact_h: "Contact",
    contact_p: "Message me — we'll find a time that works.",
    footer: "© 2026 Kristel Magician",
    quick: { n: "Quick reading", d: "1 question · 3 cards", l: ["One question", "3-card spread", "Answer by text or voice"] },
    full:  { n: "Full consultation", d: "45 minutes", l: ["Up to 3 questions", "Detailed spread", "Notes after the session"] },
    deep:  { n: "Deep session", d: "~75 minutes", l: ["In-depth analysis", "Several spreads", "Guidance and plan"] },
    book: "Book now"
  }
};

const CONTACT = "#contact";
let lang = "uk";

function render() {
  const t = T[lang];
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i18n]").forEach(el => {
    el.innerHTML = t[el.dataset.i18n] ?? "";
  });
  document.querySelectorAll(".lang button").forEach(b =>
    b.setAttribute("aria-pressed", b.dataset.lang === lang)
  );
  document.getElementById("priceGrid").innerHTML = SERVICES.map(s => {
    const c = t[s.id];
    const priceBlock = lang === "uk"
      ? `<div class="price">${s.uah} ₴</div><span class="old">${s.uahOld} ₴</span>`
      : `<div class="price">€${s.eur}</div><span class="old" style="visibility:hidden">—</span>`;
    return `<article class="card${s.featured ? " feat" : ""}">
      <h3>${c.n}</h3>
      <p class="dur">${c.d}</p>
      <ul>${c.l.map(i => `<li>${i}</li>`).join("")}</ul>
      ${priceBlock}
      <a class="btn" href="${CONTACT}">${t.book}</a>
    </article>`;
  }).join("");
  try { localStorage.setItem("lang", lang); } catch (e) {}
}

document.querySelectorAll(".lang button").forEach(b =>
  b.addEventListener("click", () => { lang = b.dataset.lang; render(); })
);

try {
  lang = localStorage.getItem("lang") ||
    ((navigator.language || "").toLowerCase().startsWith("uk") ? "uk" : "en");
} catch (e) {}
render();
</script>
</body>
</html>
