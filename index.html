<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kristel Magician · Таро та езотеричні консультації</title>
<meta name="description" content="Таро та езотеричні консультації онлайн. Calm tarot & esoteric sessions by Kristel Magician.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a1620;
  --bg2: #0f1f2c;
  --bg3: #132836;
  --ink: #f0e6d8;
  --muted: #9bb0bc;
  --teal: #0d7377;
  --teal-bright: #14a3a8;
  --gold: #d4a84b;
  --gold-soft: #e8c878;
  --indigo: #1a2744;
  --line: rgba(20, 163, 168, 0.18);
  --glass: rgba(15, 31, 44, 0.72);
  --serif: "Cormorant Garamond", Georgia, serif;
  --sans: "Outfit", system-ui, -apple-system, sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 17px/1.65 var(--sans);
  font-weight: 400;
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; text-decoration: none; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }

.wrap { max-width: 1080px; margin: 0 auto; padding: 0 24px; }

/* subtle peacock gradient bg */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse 80% 50% at 15% 10%, rgba(13, 115, 119, 0.18), transparent 50%),
    radial-gradient(ellipse 60% 40% at 90% 80%, rgba(26, 39, 68, 0.35), transparent 45%),
    radial-gradient(ellipse 40% 30% at 70% 20%, rgba(212, 168, 75, 0.04), transparent 40%);
  pointer-events: none;
  z-index: 0;
}
main, header, footer { position: relative; z-index: 1; }

/* header */
header {
  position: sticky;
  top: 0;
  z-index: 20;
  background: rgba(10, 22, 32, 0.85);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--line);
}
header .wrap {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding-top: 14px;
  padding-bottom: 14px;
}
.logo {
  font: 600 22px/1 var(--serif);
  letter-spacing: 0.02em;
  color: var(--ink);
  display: flex;
  align-items: center;
  gap: 8px;
}
.logo span {
  color: var(--gold);
  font-weight: 500;
}
nav {
  display: flex;
  gap: 22px;
  align-items: center;
  font-size: 14.5px;
  font-weight: 400;
  letter-spacing: 0.02em;
}
nav a {
  color: var(--muted);
  transition: color 0.2s;
}
nav a:hover { color: var(--ink); }
.lang {
  display: flex;
  border: 1px solid var(--line);
  border-radius: 99px;
  overflow: hidden;
  margin-left: 6px;
}
.lang button {
  background: none;
  border: 0;
  color: var(--muted);
  padding: 5px 13px;
  font: 500 12.5px var(--sans);
  cursor: pointer;
  transition: all 0.2s;
}
.lang button[aria-pressed="true"] {
  background: linear-gradient(135deg, var(--teal), var(--teal-bright));
  color: #fff;
}

/* hero */
.hero {
  padding: 88px 0 72px;
  display: grid;
  grid-template-columns: 1.35fr 1fr;
  gap: 48px;
  align-items: center;
}
h1 {
  font: 600 clamp(40px, 6.2vw, 68px)/1.08 var(--serif);
  margin: 0 0 20px;
  letter-spacing: -0.01em;
}
.hero p {
  color: var(--muted);
  max-width: 42ch;
  margin: 0 0 32px;
  font-size: 17.5px;
  line-height: 1.7;
  font-weight: 300;
}
.btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: linear-gradient(135deg, var(--gold), var(--gold-soft));
  color: #1a1408;
  font-weight: 600;
  font-size: 15px;
  padding: 14px 28px;
  border-radius: 99px;
  transition: transform 0.2s, box-shadow 0.2s;
  box-shadow: 0 4px 20px rgba(212, 168, 75, 0.25);
}
.btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 28px rgba(212, 168, 75, 0.35);
}
.btn-outline {
  background: transparent;
  color: var(--gold);
  border: 1px solid rgba(212, 168, 75, 0.45);
  box-shadow: none;
}
.btn-outline:hover {
  background: rgba(212, 168, 75, 0.08);
  box-shadow: none;
}

/* candle / peacock eye ornament */
.ornament {
  justify-self: center;
  position: relative;
  width: 160px;
  height: 220px;
  display: grid;
  place-items: center;
}
.peacock-eye {
  width: 120px;
  height: 120px;
  border-radius: 50%;
  background:
    radial-gradient(circle at 50% 45%, #f0e6d8 0 8%, transparent 9%),
    radial-gradient(circle at 50% 45%, var(--gold) 0 18%, transparent 19%),
    radial-gradient(circle at 50% 48%, #1a4a5c 0 38%, transparent 39%),
    radial-gradient(circle at 50% 50%, var(--teal-bright) 0 58%, transparent 59%),
    radial-gradient(circle at 50% 52%, #0a2a3a 0 78%, transparent 79%),
    radial-gradient(circle at 50% 55%, var(--indigo) 0 100%);
  box-shadow:
    0 0 40px 12px rgba(20, 163, 168, 0.2),
    0 0 80px 20px rgba(212, 168, 75, 0.08);
  animation: pulse 4s ease-in-out infinite;
}
@keyframes pulse {
  0%, 100% { transform: scale(1); opacity: 1; }
  50% { transform: scale(1.04); opacity: 0.92; }
}
@media (prefers-reduced-motion: reduce) {
  .peacock-eye { animation: none; }
  html { scroll-behavior: auto; }
}

/* sections */
section {
  padding: 72px 0;
  border-top: 1px solid var(--line);
}
h2 {
  font: 600 clamp(28px, 4vw, 40px)/1.15 var(--serif);
  margin: 0 0 12px;
  letter-spacing: -0.01em;
}
.lead {
  color: var(--muted);
  max-width: 56ch;
  margin: 0 0 36px;
  font-weight: 300;
  font-size: 16.5px;
}

/* about */
.about {
  display: grid;
  grid-template-columns: 240px 1fr;
  gap: 40px;
  align-items: start;
}
.photo {
  aspect-ratio: 3/4;
  border-radius: 140px 140px 12px 12px;
  background: var(--bg3);
  border: 1px dashed rgba(155, 176, 188, 0.35);
  display: grid;
  place-items: center;
  color: var(--muted);
  font-size: 13.5px;
  text-align: center;
  padding: 16px;
  position: relative;
  overflow: hidden;
}
.photo::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, transparent 60%, rgba(13, 115, 119, 0.15));
  pointer-events: none;
}
.about p {
  color: var(--muted);
  margin-bottom: 16px;
  font-weight: 300;
  max-width: 52ch;
}

/* pricing */
.badge {
  display: none;
  background: linear-gradient(135deg, var(--teal), #0a5c60);
  color: #e8f4f4;
  padding: 4px 14px;
  border-radius: 99px;
  font-size: 12.5px;
  font-weight: 500;
  letter-spacing: 0.03em;
  margin-bottom: 20px;
}
html[lang="uk"] .badge { display: inline-block; }

.prices {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 20px;
}
.card {
  background: var(--glass);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid var(--line);
  padding: 28px 24px;
  border-radius: 16px;
  display: flex;
  flex-direction: column;
  transition: border-color 0.25s, transform 0.25s, box-shadow 0.25s;
}
.card:hover {
  border-color: rgba(20, 163, 168, 0.35);
  transform: translateY(-3px);
  box-shadow: 0 12px 40px rgba(0, 0, 0, 0.25);
}
.card.feat {
  border-color: rgba(212, 168, 75, 0.45);
  background: linear-gradient(160deg, rgba(212, 168, 75, 0.06), var(--glass));
  position: relative;
}
.card.feat::before {
  content: "";
  position: absolute;
  top: 0;
  left: 24px;
  right: 24px;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--gold), transparent);
  border-radius: 2px;
}
.card h3 {
  font: 600 24px/1.2 var(--serif);
  margin: 0 0 4px;
}
.dur {
  color: var(--muted);
  font-size: 13.5px;
  margin: 0 0 16px;
  font-weight: 300;
}
.card ul {
  margin: 0 0 22px;
  padding-left: 18px;
  color: var(--muted);
  font-size: 14.5px;
  font-weight: 300;
  flex: 1;
  line-height: 1.7;
}
.card ul li { margin-bottom: 4px; }
.price {
  font: 600 32px/1 var(--serif);
  color: var(--gold);
}
.old {
  color: var(--muted);
  text-decoration: line-through;
  font-size: 15px;
  margin-left: 8px;
  font-family: var(--sans);
  font-weight: 400;
  opacity: 0.7;
}
.note {
  margin-top: 24px;
  color: var(--muted);
  font-size: 13.5px;
  font-weight: 300;
}

/* gallery / space */
.gallery {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 18px;
}
.ph {
  aspect-ratio: 4/3;
  background: var(--bg3);
  border: 1px dashed rgba(155, 176, 188, 0.28);
  border-radius: 12px;
  display: grid;
  place-items: center;
  color: var(--muted);
  font-size: 13.5px;
  padding: 12px;
  text-align: center;
  transition: border-color 0.2s;
}
.ph:hover { border-color: rgba(20, 163, 168, 0.4); }
.cap {
  margin: 10px 0 0;
  font-size: 14px;
  color: var(--muted);
  font-weight: 300;
  text-align: center;
}

/* contact */
.contact-btns {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  margin-top: 8px;
}

footer {
  padding: 32px 0;
  border-top: 1px solid var(--line);
  color: var(--muted);
  font-size: 13.5px;
  font-weight: 300;
  text-align: center;
}

/* responsive */
@media (max-width: 820px) {
  .hero, .about { grid-template-columns: 1fr; }
  .ornament { order: -1; height: 140px; }
  .peacock-eye { width: 90px; height: 90px; }
  .prices, .gallery { grid-template-columns: 1fr; }
  nav a { display: none; }
  .photo { max-width: 200px; margin: 0 auto; }
  .about { text-align: center; }
  .about p { margin-left: auto; margin-right: auto; }
  h1 { text-align: center; }
  .hero p { margin-left: auto; margin-right: auto; text-align: center; }
  .hero .btn { display: flex; margin: 0 auto; width: fit-content; }
}
@media (max-width: 480px) {
  .hero { padding: 56px 0 48px; }
  section { padding: 52px 0; }
}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <a class="logo" href="#top">Kristel <span>Magician</span></a>
    <nav>
      <a href="#about" data-i18n="nav_about"></a>
      <a href="#prices" data-i18n="nav_prices"></a>
      <a href="#space" data-i18n="nav_space"></a>
      <a href="#contact" data-i18n="nav_contact"></a>
      <div class="lang" role="group" aria-label="Language">
        <button data-lang="uk" aria-pressed="true">UA</button>
        <button data-lang="en" aria-pressed="false">EN</button>
      </div>
    </nav>
  </div>
</header>

<main id="top">
  <div class="wrap hero">
    <div>
      <h1 data-i18n="h1"></h1>
      <p data-i18n="hero_p"></p>
      <a class="btn" href="#prices" data-i18n="cta"></a>
    </div>
    <div class="ornament" aria-hidden="true">
      <div class="peacock-eye"></div>
    </div>
  </div>

  <section id="about">
    <div class="wrap about">
      <div class="photo" data-i18n="photo"></div>
      <div>
        <h2 data-i18n="about_h"></h2>
        <p data-i18n="about_p1"></p>
        <p data-i18n="about_p2"></p>
      </div>
    </div>
  </section>

  <section id="prices">
    <div class="wrap">
      <h2 data-i18n="prices_h"></h2>
      <p class="lead" data-i18n="prices_lead"></p>
      <span class="badge" data-i18n="discount"></span>
      <div class="prices" id="priceGrid"></div>
      <p class="note" data-i18n="prices_note"></p>
    </div>
  </section>

  <section id="space">
    <div class="wrap">
      <h2 data-i18n="space_h"></h2>
      <p class="lead" data-i18n="space_lead"></p>
      <div class="gallery">
        <figure style="margin:0">
          <div class="ph" data-i18n="ph_room"></div>
          <figcaption class="cap" data-i18n="cap_room"></figcaption>
        </figure>
        <figure style="margin:0">
          <div class="ph" data-i18n="ph_candles"></div>
          <figcaption class="cap" data-i18n="cap_candles"></figcaption>
        </figure>
        <figure style="margin:0">
          <div class="ph" data-i18n="ph_cards"></div>
          <figcaption class="cap" data-i18n="cap_cards"></figcaption>
        </figure>
      </div>
    </div>
  </section>

  <section id="contact">
    <div class="wrap">
      <h2 data-i18n="contact_h"></h2>
      <p class="lead" data-i18n="contact_p"></p>
      <div class="contact-btns">
        <!-- TODO: заміни на свої посилання -->
        <a class="btn" href="https://t.me/your_username">Telegram</a>
        <a class="btn btn-outline" href="https://instagram.com/your_username">Instagram</a>
        <a class="btn btn-outline" href="mailto:you@example.com">Email</a>
      </div>
    </div>
  </section>
</main>

<footer>
  <div class="wrap" data-i18n="footer"></div>
</footer>

<script>
/* ===== PRICES ===== */
const SERVICES = [
  { id: "quick", uah: 900,  uahOld: 1600, eur: 60 },
  { id: "full",  uah: 1500, uahOld: 2700, eur: 100, featured: true },
  { id: "deep",  uah: 2200, uahOld: 3800, eur: 150 }
];

/* ===== TEXTS ===== */
const T = {
  uk: {
    nav_about: "Про мене",
    nav_prices: "Ціни",
    nav_space: "Простір",
    nav_contact: "Контакти",
    h1: "Таро та езотеричні консультації",
    hero_p: "Спокійна розмова в атмосфері павича і свічок: розклад, який допомагає побачити ситуацію ясніше та знайти наступний крок.",
    cta: "Обрати консультацію",
    photo: "Тут буде ваше фото",
    about_h: "Про мене",
    about_p1: "Мене звати Kristel Magician. Я працюю з картами Таро та езотеричними практиками. Розкажіть тут коротко, як ви прийшли до цього шляху.",
    about_p2: "Опишіть свій підхід: з якими питаннями до вас звертаються, як проходить сесія, що людина отримає після розмови.",
    prices_h: "Консультації та ціни",
    prices_lead: "Оберіть формат, який підходить вам. Усі консультації проходять онлайн.",
    discount: "Знижка для України",
    prices_note: "Ціни вказано за одну консультацію. Оплата наперед.",
    space_h: "Мій простір",
    space_lead: "Кімната, де проходять консультації, свічки ручної роботи та колода, з якою я працюю.",
    ph_room: "Фото кімнати",
    ph_candles: "Фото свічок",
    ph_cards: "Фото колоди",
    cap_room: "Кімната для консультацій",
    cap_candles: "Свічки ручної роботи",
    cap_cards: "Моя колода",
    contact_h: "Записатися",
    contact_p: "Напишіть мені, і ми оберемо зручний час.",
    footer: "© 2026 Kristel Magician",
    quick: {
      n: "Швидкий розклад",
      d: "1 питання · 3 карти",
      l: ["Одне чітке питання", "Розклад на 3 карти", "Відповідь текстом або голосом"]
    },
    full: {
      n: "Повна консультація",
      d: "45 хв",
      l: ["До 3 питань", "Детальний розклад", "Записи розмови після сесії"]
    },
    deep: {
      n: "Глибока сесія",
      d: "~75 хв",
      l: ["Аналіз ситуації", "Кілька розкладів", "Рекомендації та план дій"]
    },
    book: "Записатися"
  },
  en: {
    nav_about: "About",
    nav_prices: "Pricing",
    nav_space: "My space",
    nav_contact: "Contact",
    h1: "Tarot & esoteric consultations",
    hero_p: "A calm conversation in the atmosphere of peacock light and candles: a reading that helps you see your situation more clearly and find your next step.",
    cta: "Choose a session",
    photo: "Your photo goes here",
    about_h: "About me",
    about_p1: "I'm Kristel Magician. I work with Tarot and esoteric practices. Briefly tell here how you came to this path.",
    about_p2: "Describe your approach: what people come to you for, how a session runs, and what they leave with.",
    prices_h: "Sessions & pricing",
    prices_lead: "Pick the format that suits you. All sessions take place online.",
    discount: "",
    prices_note: "Prices are per session. Payment in advance.",
    space_h: "My space",
    space_lead: "The room where sessions happen, my handmade candles and the deck I read with.",
    ph_room: "Room photo",
    ph_candles: "Candles photo",
    ph_cards: "Deck photo",
    cap_room: "The consultation room",
    cap_candles: "Handmade candles",
    cap_cards: "My deck",
    contact_h: "Book a session",
    contact_p: "Message me and we'll find a time that works.",
    footer: "© 2026 Kristel Magician",
    quick: {
      n: "Quick reading",
      d: "1 question · 3 cards",
      l: ["One clear question", "3-card spread", "Answer by text or voice"]
    },
    full: {
      n: "Full consultation",
      d: "45 min",
      l: ["Up to 3 questions", "Detailed spread", "Session notes sent afterwards"]
    },
    deep: {
      n: "Deep session",
      d: "~75 min",
      l: ["In-depth analysis", "Several spreads", "Guidance and action plan"]
    },
    book: "Book now"
  }
};

const CONTACT = "#contact";
let lang = "uk";

function render() {
  const t = T[lang];
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i18n]").forEach(el => {
    el.textContent = t[el.dataset.i18n] ?? "";
  });
  document.querySelectorAll(".lang button").forEach(b =>
    b.setAttribute("aria-pressed", b.dataset.lang === lang)
  );
  document.getElementById("priceGrid").innerHTML = SERVICES.map(s => {
    const c = t[s.id];
    const price = lang === "uk"
      ? `<span class="price">${s.uah} ₴</span><span class="old">${s.uahOld} ₴</span>`
      : `<span class="price">€${s.eur}</span>`;
    return `<article class="card${s.featured ? " feat" : ""}">
      <h3>${c.n}</h3>
      <p class="dur">${c.d}</p>
      <ul>${c.l.map(i => `<li>${i}</li>`).join("")}</ul>
      <div>${price}</div>
      <p style="margin:18px 0 0"><a class="btn" href="${CONTACT}" style="font-size:14px;padding:11px 22px">${t.book}</a></p>
    </article>`;
  }).join("");
  try { localStorage.setItem("lang", lang); } catch (e) {}
}

document.querySelectorAll(".lang button").forEach(b =>
  b.addEventListener("click", () => { lang = b.dataset.lang; render(); })
);

try {
  lang = localStorage.getItem("lang") ||
    ((navigator.language || "").toLowerCase().startsWith("uk") ? "uk" : "en");
} catch (e) {}
render();
</script>
</body>
</html>
