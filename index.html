<style>
:root {
  --bg: #04070D;
  --bg-2: #0A1019;
  --lav: #A596D8;
  --lav-soft: #CFC6EE;
  --lav-deep: #5B4A9E;
  --rasp: #C2336F;
  --rasp-bright: #EC5C93;
  --teal: #2FB5B0;
  --teal-bright: #72EADD;
  --ink: #F2EFF9;
  --muted: #A9A8C6;
  --card: rgba(22, 17, 42, .55);
  --line: rgba(165, 150, 216, .18);
  --line-strong: rgba(165, 150, 216, .38);
  --display: "Cinzel", Georgia, serif;
  --serif: "Cormorant Garamond", Georgia, serif;
  --sans: "Inter", system-ui, sans-serif;
  --rune: "Noto Sans Runic", "Segoe UI Symbol", "Noto Sans Symbols", sans-serif;
  --radius: 18px;
  --header-h: 68px;
  --ease: cubic-bezier(.22, .8, .24, 1);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; scroll-padding-top: 80px; }
body { background: var(--bg); color: var(--ink); font: 400 16px/1.65 var(--sans); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
a { color: inherit; text-decoration: none; }
button { font: inherit; cursor: pointer; border: 0; background: none; color: inherit; }
ul { list-style: none; }
:focus-visible { outline: 2px solid var(--teal-bright); outline-offset: 3px; border-radius: 6px; }
::selection { background: var(--rasp); color: #fff; }

#stars { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
.aurora { position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background:
    radial-gradient(ellipse 70% 45% at 50% -10%, rgba(120, 95, 200, .34), transparent 62%),
    radial-gradient(ellipse 50% 40% at 100% 40%, rgba(194, 51, 111, .13), transparent 60%),
    radial-gradient(ellipse 60% 45% at 0% 100%, rgba(47, 181, 176, .17), transparent 62%); }
.glow { position: fixed; width: 460px; height: 460px; left: 0; top: 0; z-index: 0; pointer-events: none;
  background: radial-gradient(circle, rgba(165, 150, 216, .14), transparent 65%); opacity: 0; transition: opacity .4s; }
@media (hover: none) { .glow { display: none; } }

.wrap { width: min(1140px, 100% - 40px); margin-inline: auto; position: relative; z-index: 1; }

/* HEADER */
.header { position: fixed; inset: 0 0 auto 0; z-index: 100; height: var(--header-h); display: flex; align-items: center; border-bottom: 1px solid transparent; transition: background .35s, border-color .35s; }
.header.scrolled { background: rgba(4, 7, 13, .78); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); border-color: var(--line); }
.header .wrap { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.logo { font-family: var(--display); font-size: 15px; letter-spacing: .18em; text-transform: uppercase; display: flex; align-items: center; gap: 10px; }
.logo i { font-style: normal; color: var(--rasp-bright); }
.logo b { font-weight: 500; }
.logo span { background: linear-gradient(90deg, var(--lav-soft), var(--rasp-bright)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.nav { display: flex; align-items: center; gap: 28px; }
.nav a { position: relative; font-size: 12px; font-weight: 500; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); transition: color .2s; padding: 4px 0; }
.nav a::after { content: ""; position: absolute; left: 0; bottom: -2px; height: 1px; width: 100%; background: linear-gradient(90deg, var(--rasp-bright), var(--teal-bright)); transform: scaleX(0); transform-origin: left; transition: transform .35s var(--ease); }
.nav a:hover { color: var(--lav-soft); } .nav a:hover::after { transform: scaleX(1); }
.lang { display: flex; border: 1px solid var(--line-strong); border-radius: 999px; overflow: hidden; }
.lang button { padding: 5px 12px; font-size: 11px; font-weight: 500; letter-spacing: .08em; color: var(--muted); transition: .2s; }
.lang button[aria-pressed="true"] { background: linear-gradient(135deg, var(--lav-deep), var(--rasp)); color: #fff; }
.burger { display: none; width: 42px; height: 42px; place-items: center; border: 1px solid var(--line-strong); border-radius: 10px; }
.burger span, .burger span::before, .burger span::after { display: block; width: 18px; height: 1.5px; background: var(--ink); position: relative; transition: .25s; }
.burger span::before, .burger span::after { content: ""; position: absolute; left: 0; }
.burger span::before { top: -6px; } .burger span::after { top: 6px; }
.burger[aria-expanded="true"] span { background: transparent; }
.burger[aria-expanded="true"] span::before { transform: translateY(6px) rotate(45deg); }
.burger[aria-expanded="true"] span::after { transform: translateY(-6px) rotate(-45deg); }
.mobile-nav { position: fixed; top: var(--header-h); left: 0; right: 0; z-index: 99; background: rgba(4, 7, 13, .97); backdrop-filter: blur(20px); border-bottom: 1px solid var(--line); padding: 12px 24px 28px; display: flex; flex-direction: column; transform: translateY(-12px); opacity: 0; pointer-events: none; transition: .3s var(--ease); }
.mobile-nav.open { transform: none; opacity: 1; pointer-events: auto; }
.mobile-nav a { padding: 14px 4px; font-size: 14px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); border-bottom: 1px solid var(--line); }

/* BUTTONS */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 15px 30px; font-size: 12px; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; border-radius: 999px; border: 1px solid transparent; transition: transform .25s var(--ease), box-shadow .3s, background-position .4s, border-color .25s, background-color .25s; }
.btn:hover { transform: translateY(-2px); }
.btn-primary { background: linear-gradient(120deg, #a62a5f, var(--rasp-bright) 50%, #a62a5f); background-size: 200% 100%; color: #fff; box-shadow: 0 6px 30px rgba(194, 51, 111, .38); }
.btn-primary:hover { background-position: 100% 0; box-shadow: 0 10px 40px rgba(236, 92, 147, .5); }
.btn-outline { border-color: var(--line-strong); color: var(--lav-soft); }
.btn-outline:hover { border-color: var(--teal-bright); color: var(--teal-bright); background: rgba(47, 181, 176, .07); box-shadow: 0 0 28px rgba(47, 181, 176, .18); }

/* HERO */
.hero { position: relative; z-index: 1; min-height: 100svh; display: flex; align-items: center; padding: calc(var(--header-h) + 36px) 0 70px; }
.hero .wrap { display: grid; grid-template-columns: 1.05fr .95fr; gap: 44px; align-items: center; }
.eyebrow { display: inline-flex; align-items: center; gap: 12px; font-size: 11px; font-weight: 500; letter-spacing: .28em; text-transform: uppercase; color: var(--teal-bright); margin-bottom: 26px; }
.eyebrow::before { content: ""; width: 40px; height: 1px; background: linear-gradient(90deg, transparent, var(--teal-bright)); }
.hero h1 { font-family: var(--display); font-weight: 400; font-size: clamp(2.2rem, 5.3vw, 4rem); line-height: 1.1; letter-spacing: .05em; text-transform: uppercase; margin-bottom: 24px; }
.hero h1 em { font-style: normal; background: linear-gradient(100deg, var(--lav), var(--rasp-bright), #ffd6e6, var(--teal-bright), var(--lav)); background-size: 300% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: shimmer 9s linear infinite; }
@keyframes shimmer { to { background-position: -300% 0; } }
.hero-lead { font-family: var(--serif); font-size: clamp(1.15rem, 2.2vw, 1.4rem); color: var(--muted); max-width: 42ch; margin-bottom: 36px; line-height: 1.6; }
.hero-actions { display: flex; flex-wrap: wrap; gap: 14px; margin-bottom: 38px; }
.hero-facts { display: flex; flex-wrap: wrap; gap: 10px 26px; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.hero-facts span::before { content: "✦"; color: var(--rasp-bright); margin-right: 8px; font-size: 9px; }

.hero-art { position: relative; max-width: 460px; width: 100%; margin-inline: auto; aspect-ratio: 400/520; }
.hero-art svg.main { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; animation: breathe 8s ease-in-out infinite; }
@keyframes breathe { 50% { transform: translateY(-8px); } }
.rays { transform-origin: 200px 215px; animation: spin 140s linear infinite; }
.rays-rev { transform-origin: 200px 215px; animation: spin 200s linear infinite reverse; }
@keyframes spin { to { transform: rotate(360deg); } }
.twinkle { animation: tw 3.2s ease-in-out infinite; transform-origin: 200px 215px; }
@keyframes tw { 50% { opacity: .45; transform: scale(.86); } }
.rune { position: absolute; font-family: var(--rune); color: var(--teal-bright); text-shadow: 0 0 14px rgba(114, 234, 221, .8), 0 0 34px rgba(47, 181, 176, .5); opacity: .85; animation: floatr 7s ease-in-out infinite; pointer-events: none; }
@keyframes floatr { 0%, 100% { translate: 0 0; opacity: .5; } 50% { translate: 0 -14px; opacity: 1; } }

.scroll-cue { position: absolute; bottom: 22px; left: 50%; translate: -50% 0; z-index: 2; width: 22px; height: 36px; border: 1px solid var(--line-strong); border-radius: 12px; }
.scroll-cue::after { content: ""; position: absolute; left: 50%; top: 7px; width: 3px; height: 7px; margin-left: -1.5px; background: var(--rasp-bright); border-radius: 2px; animation: cue 2s ease-in-out infinite; }
@keyframes cue { 0% { opacity: 0; transform: translateY(0); } 40% { opacity: 1; } 100% { opacity: 0; transform: translateY(12px); } }

/* MARQUEE */
.marquee { position: relative; z-index: 1; border-block: 1px solid var(--line); padding: 16px 0; overflow: hidden; background: rgba(10, 16, 25, .6); }
.marquee-track { display: flex; gap: 40px; width: max-content; animation: slide 46s linear infinite; }
.marquee span { font-family: var(--display); font-size: 13px; letter-spacing: .3em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
.marquee span::after { content: "ᛟ"; font-family: var(--rune); color: var(--rasp-bright); margin-left: 40px; font-size: 12px; }
@keyframes slide { to { transform: translateX(-50%); } }

/* FRINGE (bead divider) */
.fringe { position: relative; z-index: 1; height: 70px; pointer-events: none; }
.fringe svg { width: 100%; height: 100%; display: block; }

/* SECTIONS */
section.s { position: relative; z-index: 1; padding: 96px 0; }
.section-head { text-align: center; margin-bottom: 56px; }
.kicker { display: inline-flex; align-items: center; gap: 12px; font-size: 11px; font-weight: 500; letter-spacing: .26em; text-transform: uppercase; color: var(--teal-bright); margin-bottom: 14px; }
.kicker::before, .kicker::after { content: "✦"; font-size: 9px; color: var(--rasp-bright); }
.section-head h2 { font-family: var(--display); font-weight: 400; font-size: clamp(1.7rem, 3.8vw, 2.5rem); letter-spacing: .08em; text-transform: uppercase; margin-bottom: 14px; }
.section-head p { color: var(--muted); max-width: 54ch; margin-inline: auto; font-size: 16px; }

/* ABOUT */
.about-grid { display: grid; grid-template-columns: 340px 1fr; gap: 68px; align-items: center; max-width: 1000px; margin-inline: auto; }
.arch { position: relative; aspect-ratio: 3/4; }
.arch-frame { position: absolute; inset: 0; border-radius: 200px 200px 18px 18px; background: linear-gradient(170deg, rgba(165, 150, 216, .34), rgba(60, 40, 110, .4) 55%, rgba(8, 12, 24, .9)); border: 1px solid var(--line-strong); overflow: hidden; display: grid; place-items: center; text-align: center; color: var(--lav-soft); font-size: 13px; padding: 20px; line-height: 1.5; box-shadow: 0 0 70px rgba(91, 74, 158, .4), inset 0 0 60px rgba(236, 92, 147, .08); }
.arch-frame::before { content: ""; position: absolute; inset: 0; background: radial-gradient(circle at 50% 28%, rgba(114, 234, 221, .18), transparent 55%); }
.arch-frame::after { content: ""; position: absolute; inset: 12px; border-radius: 188px 188px 10px 10px; border: 2px dotted rgba(236, 92, 147, .55); }
.arch::before { content: ""; position: absolute; inset: -14px; border: 1px solid var(--line); border-radius: 214px 214px 30px 30px; }
.arch-star { position: absolute; top: -10px; left: 50%; translate: -50% 0; background: var(--bg); padding: 0 10px; color: var(--rasp-bright); font-size: 14px; z-index: 2; }
.about-body h3 { font-family: var(--serif); font-weight: 500; font-style: italic; font-size: 2.1rem; margin-bottom: 18px; background: linear-gradient(90deg, var(--lav-soft), var(--rasp-bright)); -webkit-background-clip: text; background-clip: text; color: transparent; width: fit-content; }
.about-body p { color: var(--muted); margin-bottom: 16px; font-size: 16px; line-height: 1.8; max-width: 56ch; }
.about-tags { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 22px; }
.tag { padding: 7px 16px; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--lav-soft); border: 1px solid var(--line-strong); border-radius: 999px; }

.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; max-width: 900px; margin: 72px auto 0; }
.stat { text-align: center; padding: 26px 12px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--card); backdrop-filter: blur(10px); }
.stat b { display: block; font-family: var(--display); font-weight: 500; font-size: clamp(2rem, 4vw, 2.8rem); line-height: 1.1; background: linear-gradient(120deg, var(--lav-soft), var(--rasp-bright)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.stat span { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }

/* TIMELINE */
.tl { position: relative; max-width: 760px; margin-inline: auto; padding-left: 52px; }
.tl::before { content: ""; position: absolute; left: 15px; top: 8px; bottom: 8px; width: 2px; background: linear-gradient(180deg, var(--rasp-bright), var(--lav), var(--teal-bright)); opacity: .7; border-radius: 2px; }
.tl-item { position: relative; padding-bottom: 38px; }
.tl-item:last-child { padding-bottom: 0; }
.tl-item::before { content: ""; position: absolute; left: -45px; top: 6px; width: 16px; height: 16px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #fff, var(--rasp-bright) 45%, #8a1f4c); box-shadow: 0 0 0 5px rgba(4, 7, 13, 1), 0 0 22px rgba(236, 92, 147, .7); }
.tl-item:nth-child(even)::before { background: radial-gradient(circle at 35% 35%, #fff, var(--teal-bright) 45%, #1c7f7b); box-shadow: 0 0 0 5px rgba(4, 7, 13, 1), 0 0 22px rgba(114, 234, 221, .7); }
.tl-k { font-family: var(--display); font-size: 12px; letter-spacing: .26em; text-transform: uppercase; color: var(--teal-bright); }
.tl-item h3 { font-family: var(--serif); font-weight: 600; font-size: 1.6rem; margin: 4px 0 6px; }
.tl-item p { color: var(--muted); max-width: 54ch; }

/* PRACTICES */
.practices { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; }
.prac { position: relative; padding: 30px 22px 26px; background: var(--card); backdrop-filter: blur(12px); border: 1px solid var(--line); border-radius: var(--radius); transition: border-color .3s, transform .3s var(--ease), box-shadow .4s; overflow: hidden; }
.prac::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: radial-gradient(260px circle at var(--mx, 50%) var(--my, 0%), rgba(114, 234, 221, .11), transparent 60%); opacity: 0; transition: opacity .3s; }
.prac:hover { border-color: rgba(114, 234, 221, .45); transform: translateY(-5px); box-shadow: 0 18px 50px rgba(47, 181, 176, .14); }
.prac:hover::after { opacity: 1; }
.prac .g { font-family: var(--rune); font-size: 34px; line-height: 1; color: var(--rasp-bright); margin-bottom: 16px; display: block; filter: drop-shadow(0 0 12px rgba(236, 92, 147, .5)); }
.prac:nth-child(even) .g { color: var(--teal-bright); filter: drop-shadow(0 0 12px rgba(114, 234, 221, .5)); }
.prac h3 { font-family: var(--serif); font-weight: 600; font-size: 1.3rem; line-height: 1.2; margin-bottom: 8px; }
.prac p { font-size: 14.5px; color: var(--muted); }

/* QUOTE */
.quote { text-align: center; padding: 40px 0; }
.quote blockquote { font-family: var(--serif); font-style: italic; font-weight: 500; font-size: clamp(1.6rem, 3.8vw, 2.6rem); line-height: 1.35; max-width: 24em; margin-inline: auto; background: linear-gradient(110deg, var(--lav-soft), #fff 40%, var(--rasp-bright) 70%, var(--teal-bright)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.quote cite { display: block; margin-top: 22px; font-style: normal; font-family: var(--display); font-size: 12px; letter-spacing: .3em; text-transform: uppercase; color: var(--muted); }

/* PRICES */
.badge-ua { display: none; width: fit-content; margin: -24px auto 36px; padding: 6px 16px; font-size: 10px; font-weight: 500; letter-spacing: .16em; text-transform: uppercase; color: var(--teal-bright); border: 1px solid rgba(114, 234, 221, .4); border-radius: 999px; background: rgba(47, 181, 176, .08); }
html[lang="uk"] .badge-ua { display: block; }
.prices-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px; align-items: stretch; }
.price-card { position: relative; display: flex; flex-direction: column; padding: 36px 26px 26px; background: var(--card); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border: 1px solid var(--line); border-radius: var(--radius); transition: border-color .3s, box-shadow .4s, transform .3s var(--ease); }
.price-card::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; background: radial-gradient(300px circle at var(--mx, 50%) var(--my, 0%), rgba(236, 92, 147, .11), transparent 60%); opacity: 0; transition: opacity .3s; }
.price-card:hover { border-color: var(--line-strong); transform: translateY(-6px); box-shadow: 0 20px 56px rgba(91, 74, 158, .35); }
.price-card:hover::after { opacity: 1; }
.price-card.featured { border-color: rgba(236, 92, 147, .55); background: linear-gradient(170deg, rgba(194, 51, 111, .16), var(--card) 55%); transform: translateY(-8px); box-shadow: 0 0 60px rgba(194, 51, 111, .15); }
.price-card.featured:hover { transform: translateY(-12px); }
.ribbon { position: absolute; top: -12px; left: 50%; translate: -50% 0; background: linear-gradient(135deg, var(--rasp), var(--rasp-bright)); color: #fff; font-size: 10px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; padding: 5px 14px; border-radius: 999px; white-space: nowrap; }
.pc-title { font-family: var(--serif); font-weight: 600; font-size: 1.55rem; margin-bottom: 4px; }
.pc-dur { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--lav); margin-bottom: 20px; }
.price-card ul { flex: 1; margin-bottom: 24px; }
.price-card li { position: relative; padding-left: 20px; margin-bottom: 10px; font-size: 14.5px; color: var(--muted); }
.price-card li::before { content: "✧"; position: absolute; left: 0; top: 1px; color: var(--teal-bright); font-size: 11px; }
.pc-price { font-family: var(--display); font-size: 2.1rem; font-weight: 500; line-height: 1.1; background: linear-gradient(110deg, var(--lav-soft), var(--rasp-bright)); -webkit-background-clip: text; background-clip: text; color: transparent; width: fit-content; }
.pc-old { display: block; font-size: 13px; color: var(--muted); text-decoration: line-through; opacity: .6; margin: 4px 0 18px; min-height: 20px; }
.price-card .btn { width: 100%; padding: 13px 16px; font-size: 11px; }
.prices-note { text-align: center; margin-top: 28px; font-size: 13px; color: var(--muted); opacity: .85; }

/* DRAW */
.draw { text-align: center; }
.draw-stage { display: flex; flex-direction: column; align-items: center; gap: 30px; }
.flip { width: 230px; aspect-ratio: 2/3.3; perspective: 1200px; cursor: pointer; }
.flip-inner { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; transition: transform 1s var(--ease); }
.flip.open .flip-inner { transform: rotateY(180deg); }
.face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 16px; border: 1px solid var(--line-strong); box-shadow: 0 24px 70px rgba(0, 0, 0, .6), 0 0 60px rgba(91, 74, 158, .4); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; }
.face.back { background: radial-gradient(circle at 50% 50%, rgba(236, 92, 147, .28), transparent 46%), repeating-linear-gradient(45deg, rgba(236, 92, 147, .12) 0 2px, transparent 2px 13px), linear-gradient(165deg, #4b3a8d, #1a1236 70%); }
.face.back::before { content: ""; position: absolute; inset: 10px; border: 2px dotted rgba(236, 92, 147, .6); border-radius: 10px; }
.face.back .sig { font-size: 56px; color: #ffd6e6; filter: drop-shadow(0 0 18px rgba(236, 92, 147, .9)); animation: pulse 3.4s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .6; transform: scale(.94); } }
.face.front { transform: rotateY(180deg); background: linear-gradient(165deg, #2c2060, #0a1019); padding: 18px; text-align: center; }
.face.front::before { content: ""; position: absolute; inset: 10px; border: 2px dotted rgba(114, 234, 221, .45); border-radius: 10px; }
.face.front .num { font-family: var(--display); font-size: 13px; letter-spacing: .34em; color: var(--teal-bright); }
.face.front .glyph { font-size: 64px; color: var(--rasp-bright); filter: drop-shadow(0 0 18px rgba(236, 92, 147, .7)); line-height: 1; }
.face.front .nm { font-family: var(--display); font-size: 14px; letter-spacing: .2em; text-transform: uppercase; }
.draw-text { max-width: 46ch; min-height: 96px; }
.draw-text h3 { font-family: var(--serif); font-style: italic; font-weight: 500; font-size: 1.7rem; background: linear-gradient(90deg, var(--lav-soft), var(--rasp-bright)); -webkit-background-clip: text; background-clip: text; color: transparent; margin-bottom: 8px; display: inline-block; }
.draw-text p { color: var(--muted); font-size: 16px; }
.draw-hint { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }

/* SPACE */
.space-grid { display: grid; grid-template-columns: 1.3fr 1fr 1fr; gap: 18px; }
.space-thumb { aspect-ratio: 4/3.4; border-radius: var(--radius); border: 1px solid var(--line); background: linear-gradient(145deg, rgba(91, 74, 158, .35), var(--bg-2)); display: grid; place-items: center; text-align: center; color: var(--lav-soft); font-size: 13px; padding: 14px; margin-bottom: 14px; position: relative; overflow: hidden; transition: .3s var(--ease); }
.space-thumb::before { content: ""; position: absolute; inset: 0; background: radial-gradient(circle at 70% 25%, rgba(114, 234, 221, .14), transparent 55%); }
.space-item:hover .space-thumb { border-color: var(--line-strong); box-shadow: 0 0 40px rgba(91, 74, 158, .4); transform: translateY(-3px); }
.space-item h3 { font-family: var(--serif); font-weight: 600; font-size: 1.25rem; }
.space-item p { font-size: 14px; color: var(--muted); }

/* FAQ */
.faq { max-width: 780px; margin-inline: auto; }
.faq details { border-bottom: 1px solid var(--line); }
.faq summary { list-style: none; cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 20px; padding: 22px 4px; font-family: var(--serif); font-size: 1.3rem; font-weight: 500; transition: color .2s; }
.faq summary::-webkit-details-marker { display: none; }
.faq summary::after { content: "+"; color: var(--rasp-bright); font-size: 1.6rem; font-family: var(--sans); font-weight: 300; transition: transform .3s var(--ease); }
.faq details[open] summary { color: var(--lav-soft); }
.faq details[open] summary::after { transform: rotate(45deg); }
.faq summary:hover { color: var(--lav-soft); }
.faq .ans { padding: 0 4px 24px; color: var(--muted); max-width: 62ch; }

/* CONTACT */
.cta-box { text-align: center; padding: 76px 28px; border: 1px solid var(--line-strong); border-radius: 30px; position: relative; overflow: hidden; background: radial-gradient(ellipse 80% 90% at 50% 0%, rgba(120, 95, 200, .34), rgba(10, 16, 25, .75) 70%), radial-gradient(ellipse 60% 50% at 50% 120%, rgba(47, 181, 176, .22), transparent 70%); }
.cta-box::before { content: "✦"; position: absolute; top: 22px; left: 50%; translate: -50% 0; color: var(--rasp-bright); }
.cta-box h2 { font-family: var(--display); font-weight: 400; font-size: clamp(1.7rem, 4vw, 2.6rem); letter-spacing: .08em; text-transform: uppercase; margin: 14px 0; }
.cta-box > p.lead { color: var(--muted); max-width: 46ch; margin: 0 auto 32px; font-family: var(--serif); font-size: 1.25rem; }
.contact-btns { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; }
.contact-hint { margin-top: 24px; font-size: 13px; color: var(--muted); }

.footer { position: relative; z-index: 1; padding: 36px 0 44px; border-top: 1px solid var(--line); text-align: center; font-size: 12px; letter-spacing: .08em; color: var(--muted); }
.footer .sym { color: var(--rasp-bright); margin-bottom: 8px; }

/* REVEAL */
.js .rv { opacity: 0; transform: translateY(28px); transition: opacity .9s var(--ease), transform .9s var(--ease); transition-delay: var(--d, 0s); }
.js .rv.in { opacity: 1; transform: none; }

/* RESPONSIVE */
@media (max-width: 1000px) { .practices { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 920px) {

  .hero-art { max-width: 340px; order: -1; margin-bottom: 8px; }

  .about-grid { grid-template-columns: 1fr; text-align: center; gap: 44px; }
  .arch { max-width: 260px; margin-inline: auto; }
  .about-body p { margin-inline: auto; } .about-body h3 { margin-inline: auto; } .about-tags { justify-content: center; }
  .prices-grid, .space-grid { grid-template-columns: 1fr; max-width: 420px; margin-inline: auto; }
  .price-card.featured { transform: none; } .price-card.featured:hover { transform: translateY(-6px); }
  section.s { padding: 70px 0; }
}
@media (max-width: 560px) {
  .wrap { width: calc(100% - 28px); }

  .tl { padding-left: 44px; } .tl-item::before { left: -37px; }
}
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after { animation: none !important; transition-duration: .01ms !important; }
  .js .rv { opacity: 1; transform: none; }
}

let lang = "uk";
let current = null;
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
const NS = "http://www.w3.org/2000/svg";
const mk = (tag, attrs, parent) => {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
};

/* ---------- hero portal (beaded sunburst) ---------- */
(function buildPortal() {
  const cx = 200, cy = 215;
  const pt = (a, r) => [cx + r * Math.sin(a), cy - r * Math.cos(a)];
  const bead = $("raysBead"), thin = $("raysThin");
  for (let i = 0; i < 24; i++) {
    const a = i * 15 * Math.PI / 180, long = i % 2 === 0;
    const [x1, y1] = pt(a, 22), [x2, y2] = pt(a, long ? 118 : 76);
    mk("line", { x1, y1, x2, y2, stroke: "#EC5C93", "stroke-width": long ? 4 : 3, "stroke-linecap": "round", "stroke-dasharray": "0.1 8", opacity: .95 }, bead);
    mk("line", { x1, y1, x2, y2, stroke: "rgba(255,214,230,.35)", "stroke-width": 1 }, bead);
  }
  for (let i = 0; i < 12; i++) {
    const a = (i * 30 + 15) * Math.PI / 180;
    const [x1, y1] = pt(a, 60), [x2, y2] = pt(a, 140);
    mk("line", { x1, y1, x2, y2, stroke: "rgba(114,234,221,.55)", "stroke-width": 1, "stroke-dasharray": "1 5", "stroke-linecap": "round" }, thin);
  }
  mk("circle", { cx, cy, r: 132, stroke: "rgba(207,198,238,.35)", "stroke-width": 1 }, thin);
  mk("circle", { cx, cy, r: 100, stroke: "rgba(114,234,221,.4)", "stroke-width": 1, "stroke-dasharray": "2 6" }, thin);

  const pts = [];
  for (let i = 0; i < 16; i++) { const a = i * 22.5 * Math.PI / 180, r = i % 2 === 0 ? 36 : 12; pts.push(pt(a, r).join(",")); }
  $("star8").setAttribute("points", pts.join(" "));

  // luminous lower lines (teal) + beaded drops
  const L = $("lines");
  for (let i = 0; i < 9; i++) {
    const t = i / 8, xb = 76 + t * 248;
    mk("path", { d: `M200 405 C ${200 + (xb - 200) * .2} 450, ${xb} 460, ${xb} 508`, stroke: "rgba(114,234,221,.55)", "stroke-width": 1.2, opacity: .9 }, L);
    mk("path", { d: `M200 405 C ${200 + (xb - 200) * .2} 450, ${xb} 460, ${xb} 508`, stroke: "#EC5C93", "stroke-width": 3.5, "stroke-dasharray": "0.1 11", opacity: .8 }, L);
  }
  for (let i = 0; i < 7; i++) {
    const x = 90 + i * 37;
    mk("path", { d: `M${x - 18} 480 Q ${x} 500 ${x + 18} 480`, stroke: "rgba(207,198,238,.4)", "stroke-width": 1 }, L);
  }
})();

/* ---------- bead fringe dividers ---------- */
function buildFringes() {
  document.querySelectorAll(".fringe").forEach(box => {
    if (box.firstChild) return;
    const svg = mk("svg", { viewBox: "0 0 1200 70", preserveAspectRatio: "xMidYMin slice" });
    const defs = mk("defs", {}, svg);
    const g = mk("linearGradient", { id: "fg", x1: 0, y1: 0, x2: 0, y2: 1 }, defs);
    mk("stop", { offset: 0, "stop-color": "#EC5C93" }, g); mk("stop", { offset: 1, "stop-color": "#8a1f4c" }, g);
    mk("line", { x1: 0, y1: 1, x2: 1200, y2: 1, stroke: "rgba(165,150,216,.45)", "stroke-width": 1 }, svg);
    mk("line", { x1: 0, y1: 1, x2: 1200, y2: 1, stroke: "#EC5C93", "stroke-width": 3, "stroke-dasharray": "0.1 9", "stroke-linecap": "round", opacity: .7 }, svg);
    for (let i = 0, x = 10; x < 1200; i++, x += 20) {
      const len = 16 + (Math.sin(i * 1.3) + 1) * 14 + (i % 2) * 10;
      mk("line", { x1: x, y1: 1, x2: x, y2: len, stroke: "rgba(236,92,147,.55)", "stroke-width": 1 }, svg);
      for (let y = 8; y < len - 4; y += 7) mk("circle", { cx: x, cy: y, r: 1.5, fill: "#EC5C93", opacity: .85 }, svg);
      mk("ellipse", { cx: x, cy: len + 4, rx: 2.8, ry: 6, fill: "url(#fg)" }, svg);
      mk("ellipse", { cx: x - .8, cy: len + 2, rx: .9, ry: 2, fill: "#fff", opacity: .7 }, svg);
    }
    box.appendChild(svg);
  });
}

/* ---------- draw card ---------- */
function renderDraw() {
  const t = T[lang], open = current !== null;
  $("flip").classList.toggle("open", open);
  $("flip").setAttribute("aria-label", t.draw_btn);
  $("drawBtn").textContent = open ? t.draw_again : t.draw_btn;
  if (open) {
    const c = CARDS[current], tx = t.cards[c.k];
    $("dNum").textContent = c.n; $("dGlyph").textContent = c.g; $("dName").textContent = tx[0];
    $("dTitle").textContent = tx[0]; $("dText").textContent = tx[1];
  } else {
    $("dTitle").textContent = t.draw_idle_t; $("dText").textContent = t.draw_idle_p;
  }
}
function drawCard() {
  const flip = $("flip"), wasOpen = current !== null;
  const pick = () => { let n; do { n = Math.floor(Math.random() * CARDS.length); } while (n === current); current = n; renderDraw(); };
  if (wasOpen) { flip.classList.remove("open"); setTimeout(pick, 650); } else pick();
}

/* ---------- reveal ---------- */
const io = "IntersectionObserver" in window
  ? new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } }), { threshold: .12, rootMargin: "0px 0px -40px 0px" })
  : null;
function observeAll() { document.querySelectorAll(".rv:not(.in)").forEach(el => io ? io.observe(el) : el.classList.add("in")); }

function spotlight(sel) {
  document.querySelectorAll(sel).forEach(card => card.addEventListener("pointermove", e => {
    const r = card.getBoundingClientRect();
    card.style.setProperty("--mx", (e.clientX - r.left) + "px");
    card.style.setProperty("--my", (e.clientY - r.top) + "px");
  }));
}

/* ---------- render ---------- */
function render() {
  const t = T[lang];
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i18n]").forEach(el => {
    const v = t[el.dataset.i18n];
    if (typeof v === "string") el.innerHTML = v;
  });
  document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === lang ? "true" : "false"));

  const row = t.marquee.map(m => `<span>${esc(m)}</span>`).join("");
  $("marquee").innerHTML = row + row + row + row;

  $("stats").innerHTML = t.stats.map((s, i) => `<div class="stat rv" style="--d:${i * .1}s"><b>${esc(s.n)}</b><span>${esc(s.l)}</span></div>`).join("");
  $("timeline").innerHTML = t.path.map((p, i) => `<div class="tl-item rv" style="--d:${i * .06}s"><div class="tl-k">${esc(p.k)}</div><h3>${esc(p.t)}</h3><p>${esc(p.p)}</p></div>`).join("");
  $("pracGrid").innerHTML = t.prac.map((p, i) => `<article class="prac rv" style="--d:${(i % 4) * .08}s"><span class="g" aria-hidden="true">${PRAC_GLYPHS[i]}\uFE0E</span><h3>${esc(p.t)}</h3><p>${esc(p.p)}</p></article>`).join("");

  $("priceGrid").innerHTML = SERVICES.map((s, i) => {
    const c = t[s.id];
    const price = lang === "uk"
      ? `<div class="pc-price">${s.uah} ₴</div><span class="pc-old">${s.uahOld} ₴</span>`
      : `<div class="pc-price">€${s.eur}</div><span class="pc-old"></span>`;
    return `<article class="price-card rv${s.featured ? " featured" : ""}" style="--d:${i * .1}s">
      ${s.featured ? `<span class="ribbon">${esc(t.popular)}</span>` : ""}
      <h3 class="pc-title">${esc(c.n)}</h3><p class="pc-dur">${esc(c.d)}</p>
      <ul>${c.l.map(x => `<li>${esc(x)}</li>`).join("")}</ul>${price}
      <a class="btn ${s.featured ? "btn-primary" : "btn-outline"}" href="#contact">${esc(t.book)}</a></article>`;
  }).join("");

  $("faqList").innerHTML = t.faq.map(f => `<details><summary>${esc(f.q)}</summary><p class="ans">${esc(f.a)}</p></details>`).join("");

  spotlight(".price-card"); spotlight(".prac");
  renderDraw(); buildFringes(); observeAll();
  try { localStorage.setItem("km_lang", lang); } catch (e) {}
}

/* ---------- events ---------- */
document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => { lang = b.dataset.lang; render(); }));
const burger = $("burger"), mobileNav = $("mobileNav");
burger.addEventListener("click", () => {
  const open = burger.getAttribute("aria-expanded") === "true";
  burger.setAttribute("aria-expanded", String(!open)); mobileNav.classList.toggle("open", !open);
});
mobileNav.querySelectorAll("a").forEach(a => a.addEventListener("click", () => { burger.setAttribute("aria-expanded", "false"); mobileNav.classList.remove("open"); }));
$("drawBtn").addEventListener("click", drawCard);
$("flip").addEventListener("click", () => { if (current === null) drawCard(); });
$("flip").addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); drawCard(); } });

const header = $("header");
const onScroll = () => header.classList.toggle("scrolled", window.scrollY > 24);
window.addEventListener("scroll", onScroll, { passive: true }); onScroll();

const glow = $("glow");
window.addEventListener("pointermove", e => { glow.style.opacity = 1; glow.style.transform = `translate(${e.clientX - 230}px, ${e.clientY - 230}px)`; }, { passive: true });

/* ---------- starfield ---------- */
(function stars() {
  const cv = $("stars"), ctx = cv.getContext("2d");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let w, h, S = [];
  const dpr = Math.min(devicePixelRatio || 1, 2);
  const COLORS = ["207,198,238", "207,198,238", "114,234,221", "236,92,147"];
  function size() {
    w = innerWidth; h = innerHeight;
    cv.width = w * dpr; cv.height = h * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    S = Array.from({ length: Math.round(w * h / 9000) }, () => ({
      x: Math.random() * w, y: Math.random() * h, r: Math.random() * 1.2 + .2,
      p: Math.random() * 6.28, s: Math.random() * .02 + .005, c: COLORS[Math.floor(Math.random() * COLORS.length)]
    }));
  }
  function frame(t) {
    ctx.clearRect(0, 0, w, h);
    for (const s of S) {
      ctx.fillStyle = `rgba(${s.c},${.25 + .6 * (.5 + .5 * Math.sin(s.p + t * s.s * .06))})`;
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 6.283); ctx.fill();
    }
    if (!reduce) requestAnimationFrame(frame);
  }
  size(); addEventListener("resize", size); requestAnimationFrame(frame);
})();

try {
  lang = localStorage.getItem("km_lang") || ((navigator.language || "").toLowerCase().startsWith("uk") ? "uk" : "en");
