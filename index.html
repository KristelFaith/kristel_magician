<style>
:root {
  --bg: #07070C;
  --bg-2: #0D0C16;
  --card: rgba(24, 19, 40, 0.62);
  --violet-deep: #1B1030;
  --violet: #4A3596;
  --violet-soft: #8B7BC4;
  --gold: #D4AF37;
  --gold-bright: #F0CF6E;
  --gold-dim: rgba(212, 175, 55, 0.32);
  --ink: #F4EEE6;
  --muted: #A99CBC;
  --line: rgba(212, 175, 55, 0.14);
  --line-strong: rgba(212, 175, 55, 0.34);
  --display: "Cinzel", Georgia, serif;
  --serif: "Cormorant Garamond", Georgia, serif;
  --sans: "Inter", system-ui, sans-serif;
  --radius: 16px;
  --header-h: 68px;
  --ease: cubic-bezier(.22, .8, .24, 1);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; scroll-padding-top: 80px; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 400 16px/1.65 var(--sans);
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
a { color: inherit; text-decoration: none; }
button { font: inherit; cursor: pointer; border: 0; background: none; color: inherit; }
ul { list-style: none; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; border-radius: 6px; }
::selection { background: var(--violet); color: #fff; }

#stars { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
.aurora {
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background:
    radial-gradient(ellipse 60% 40% at 50% -8%, rgba(74, 53, 150, .35), transparent 60%),
    radial-gradient(ellipse 35% 30% at 100% 55%, rgba(60, 30, 90, .30), transparent 60%),
    radial-gradient(ellipse 30% 25% at 0% 85%, rgba(212, 175, 55, .06), transparent 60%);
}
.glow {
  position: fixed; width: 420px; height: 420px; left: 0; top: 0; z-index: 0; pointer-events: none;
  background: radial-gradient(circle, rgba(139, 123, 196, .14), transparent 65%);
  transform: translate(-50%, -50%); opacity: 0; transition: opacity .4s;
}
@media (hover: none) { .glow { display: none; } }

.wrap { width: min(1120px, 100% - 40px); margin-inline: auto; position: relative; z-index: 1; }

/* HEADER */
.header {
  position: fixed; inset: 0 0 auto 0; z-index: 100; height: var(--header-h);
  display: flex; align-items: center;
  transition: background .35s, border-color .35s, backdrop-filter .35s;
  border-bottom: 1px solid transparent;
}
.header.scrolled {
  background: rgba(7, 7, 12, .8);
  backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
  border-color: var(--line);
}
.header .wrap { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.logo { font-family: var(--display); font-size: 15px; letter-spacing: .18em; text-transform: uppercase; display: flex; align-items: center; gap: 10px; }
.logo i { font-style: normal; color: var(--gold); font-size: 16px; }
.logo span { color: var(--gold-bright); }
.nav { display: flex; align-items: center; gap: 30px; }
.nav a:not(.btn) {
  position: relative; font-size: 12px; font-weight: 500; letter-spacing: .12em; text-transform: uppercase;
  color: var(--muted); transition: color .2s; padding: 4px 0;
}
.nav a:not(.btn)::after {
  content: ""; position: absolute; left: 0; bottom: -2px; height: 1px; width: 100%;
  background: var(--gold); transform: scaleX(0); transform-origin: left; transition: transform .35s var(--ease);
}
.nav a:not(.btn):hover { color: var(--gold-bright); }
.nav a:not(.btn):hover::after { transform: scaleX(1); }
.lang { display: flex; border: 1px solid var(--line-strong); border-radius: 999px; overflow: hidden; }
.lang button { padding: 5px 12px; font-size: 11px; font-weight: 500; letter-spacing: .08em; color: var(--muted); transition: .2s; }
.lang button[aria-pressed="true"] { background: linear-gradient(135deg, var(--violet), #6a53b8); color: #fff; }
.burger { display: none; width: 42px; height: 42px; place-items: center; border: 1px solid var(--line-strong); border-radius: 10px; }
.burger span, .burger span::before, .burger span::after { display: block; width: 18px; height: 1.5px; background: var(--ink); position: relative; transition: .25s; }
.burger span::before, .burger span::after { content: ""; position: absolute; left: 0; }
.burger span::before { top: -6px; } .burger span::after { top: 6px; }
.burger[aria-expanded="true"] span { background: transparent; }
.burger[aria-expanded="true"] span::before { transform: translateY(6px) rotate(45deg); }
.burger[aria-expanded="true"] span::after { transform: translateY(-6px) rotate(-45deg); }
.mobile-nav {
  position: fixed; top: var(--header-h); left: 0; right: 0; z-index: 99;
  background: rgba(7, 7, 12, .97); backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--line); padding: 12px 24px 28px;
  display: flex; flex-direction: column;
  transform: translateY(-12px); opacity: 0; pointer-events: none; transition: .3s var(--ease);
}
.mobile-nav.open { transform: none; opacity: 1; pointer-events: auto; }
.mobile-nav a { padding: 14px 4px; font-size: 14px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); border-bottom: 1px solid var(--line); }

/* BUTTONS */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 15px 30px; font-size: 12px; font-weight: 500; letter-spacing: .14em; text-transform: uppercase;
  border-radius: 999px; border: 1px solid transparent;
  transition: transform .25s var(--ease), box-shadow .3s, background .25s, border-color .25s;
}
.btn:hover { transform: translateY(-2px); }
.btn-gold { background: linear-gradient(135deg, #C99B22, var(--gold-bright) 55%, #C99B22); background-size: 200% 100%; color: #1a1408; box-shadow: 0 6px 28px rgba(212, 175, 55, .28); }
.btn-gold:hover { background-position: 100% 0; box-shadow: 0 10px 38px rgba(212, 175, 55, .45); }
.btn-outline { border-color: var(--line-strong); color: var(--gold-bright); }
.btn-outline:hover { border-color: var(--gold); background: rgba(212, 175, 55, .07); box-shadow: 0 0 28px rgba(212, 175, 55, .14); }

/* HERO */
.hero { position: relative; z-index: 1; min-height: 100svh; display: flex; align-items: center; padding: calc(var(--header-h) + 40px) 0 72px; }
.hero .wrap { display: grid; grid-template-columns: 1.05fr .95fr; gap: 40px; align-items: center; }
.eyebrow { display: inline-flex; align-items: center; gap: 12px; font-size: 11px; font-weight: 500; letter-spacing: .28em; text-transform: uppercase; color: var(--gold); margin-bottom: 26px; }
.eyebrow::before { content: ""; width: 40px; height: 1px; background: linear-gradient(90deg, transparent, var(--gold)); }
.hero h1 {
  font-family: var(--display); font-weight: 400; font-size: clamp(2.2rem, 5.4vw, 4rem);
  line-height: 1.1; letter-spacing: .05em; text-transform: uppercase; margin-bottom: 24px;
}
.hero h1 em {
  font-style: normal;
  background: linear-gradient(100deg, #b98a1c, var(--gold-bright), #fff2c2, var(--gold-bright), #b98a1c);
  background-size: 250% 100%; -webkit-background-clip: text; background-clip: text; color: transparent;
  animation: shimmer 7s linear infinite;
}
@keyframes shimmer { to { background-position: -250% 0; } }
.hero-lead { font-family: var(--serif); font-size: clamp(1.15rem, 2.2vw, 1.4rem); color: var(--muted); max-width: 40ch; margin-bottom: 36px; line-height: 1.6; }
.hero-actions { display: flex; flex-wrap: wrap; gap: 14px; margin-bottom: 40px; }
.hero-facts { display: flex; flex-wrap: wrap; gap: 10px 26px; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.hero-facts span::before { content: "✦"; color: var(--gold); margin-right: 8px; font-size: 9px; }

.hero-art { position: relative; aspect-ratio: 1; max-width: 520px; margin-inline: auto; width: 100%; }
.ring { position: absolute; inset: 0; width: 100%; height: 100%; animation: spin 90s linear infinite; opacity: .9; }
.ring.r2 { inset: 9%; width: 82%; height: 82%; animation-direction: reverse; animation-duration: 140s; opacity: .55; }
@keyframes spin { to { transform: rotate(360deg); } }
.moon {
  position: absolute; left: 50%; top: 50%; width: 30%; aspect-ratio: 1; transform: translate(-50%, -50%); border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, #fff6d6, var(--gold-bright) 40%, #a67c1a 100%);
  box-shadow: 0 0 80px 20px rgba(212, 175, 55, .22), inset -12px -8px 30px rgba(60, 30, 0, .45);
  opacity: .9;
}
.moon::after { content: ""; position: absolute; inset: 0; border-radius: 50%; background: radial-gradient(circle at 72% 40%, #0B0A14 0 52%, transparent 53%); }
.fan { position: absolute; inset: 0; display: grid; place-items: center; }
.tcard {
  position: absolute; width: 34%; aspect-ratio: 2/3.3; border-radius: 12px;
  background: linear-gradient(160deg, #20143c, #0f0a1e);
  border: 1px solid var(--gold-dim); box-shadow: 0 18px 50px rgba(0, 0, 0, .6), 0 0 30px rgba(74, 53, 150, .3);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
  animation: float 7s ease-in-out infinite;
}
.tcard::before { content: ""; position: absolute; inset: 7px; border: 1px solid var(--line-strong); border-radius: 8px; }
.tcard .num { font-family: var(--display); font-size: clamp(10px, 1.6vw, 13px); letter-spacing: .3em; color: var(--gold); }
.tcard .glyph { font-size: clamp(30px, 6vw, 56px); color: var(--gold-bright); line-height: 1; filter: drop-shadow(0 0 14px rgba(240, 207, 110, .5)); }
.tcard .nm { font-family: var(--display); font-size: clamp(8px, 1.4vw, 11px); letter-spacing: .22em; text-transform: uppercase; color: var(--muted); }
.tcard.c1 { transform: translate(-62%, 8%) rotate(-12deg); animation-delay: -2s; }
.tcard.c2 { transform: translateY(-6%); z-index: 2; animation-delay: 0s; }
.tcard.c3 { transform: translate(62%, 8%) rotate(12deg); animation-delay: -4s; }
@keyframes float {
  0%, 100% { translate: 0 0; } 50% { translate: 0 -12px; }
}

.scroll-cue { position: absolute; bottom: 24px; left: 50%; translate: -50% 0; z-index: 2; width: 22px; height: 36px; border: 1px solid var(--line-strong); border-radius: 12px; }
.scroll-cue::after { content: ""; position: absolute; left: 50%; top: 7px; width: 3px; height: 7px; margin-left: -1.5px; background: var(--gold); border-radius: 2px; animation: cue 2s ease-in-out infinite; }
@keyframes cue { 0% { opacity: 0; transform: translateY(0); } 40% { opacity: 1; } 100% { opacity: 0; transform: translateY(12px); } }

/* MARQUEE */
.marquee { position: relative; z-index: 1; border-block: 1px solid var(--line); padding: 16px 0; overflow: hidden; background: rgba(13, 12, 22, .6); }
.marquee-track { display: flex; gap: 40px; width: max-content; animation: slide 42s linear infinite; }
.marquee span { font-family: var(--display); font-size: 13px; letter-spacing: .3em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
.marquee span::after { content: "✦"; color: var(--gold); margin-left: 40px; font-size: 10px; }
@keyframes slide { to { transform: translateX(-50%); } }

/* SECTIONS */
section.s { position: relative; z-index: 1; padding: 104px 0; }
.section-head { text-align: center; margin-bottom: 56px; }
.kicker { display: inline-flex; align-items: center; gap: 12px; font-size: 11px; font-weight: 500; letter-spacing: .26em; text-transform: uppercase; color: var(--gold); margin-bottom: 14px; }
.kicker::before, .kicker::after { content: "✦"; font-size: 9px; opacity: .8; }
.section-head h2 { font-family: var(--display); font-weight: 400; font-size: clamp(1.7rem, 3.8vw, 2.5rem); letter-spacing: .08em; text-transform: uppercase; margin-bottom: 14px; }
.section-head p { color: var(--muted); max-width: 52ch; margin-inline: auto; font-size: 16px; }

/* ABOUT */
.about-grid { display: grid; grid-template-columns: 340px 1fr; gap: 64px; align-items: center; max-width: 980px; margin-inline: auto; }
.arch { position: relative; aspect-ratio: 3/4; }
.arch-frame {
  position: absolute; inset: 0; border-radius: 200px 200px 16px 16px;
  background: linear-gradient(165deg, #2a1b4d, #130c26 60%, #0a0813);
  border: 1px solid var(--line-strong); overflow: hidden;
  display: grid; place-items: center; text-align: center; color: var(--muted); font-size: 13px; padding: 20px; line-height: 1.5;
  box-shadow: 0 0 60px rgba(74, 53, 150, .3);
}
.arch-frame::before { content: ""; position: absolute; inset: 0; background: radial-gradient(circle at 50% 30%, rgba(212, 175, 55, .13), transparent 55%); }
.arch::before { content: ""; position: absolute; inset: -14px; border: 1px solid var(--line); border-radius: 214px 214px 28px 28px; }
.arch-star { position: absolute; top: -9px; left: 50%; translate: -50% 0; background: var(--bg); padding: 0 10px; color: var(--gold); font-size: 14px; z-index: 2; }
.about-body h3 { font-family: var(--serif); font-weight: 500; font-style: italic; font-size: 2rem; margin-bottom: 18px; color: var(--gold-bright); }
.about-body p { color: var(--muted); margin-bottom: 16px; font-size: 16px; line-height: 1.8; max-width: 54ch; }
.about-tags { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 24px; }
.tag { padding: 7px 16px; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); border: 1px solid rgba(139, 123, 196, .4); border-radius: 999px; }

/* STEPS */
.steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; counter-reset: st; position: relative; }
.step { position: relative; padding: 34px 26px 28px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--card); backdrop-filter: blur(12px); transition: .3s var(--ease); }
.step:hover { border-color: var(--line-strong); transform: translateY(-4px); }
.step::before { counter-increment: st; content: counter(st, upper-roman); font-family: var(--display); font-size: 2.6rem; color: transparent; -webkit-text-stroke: 1px var(--gold-dim); line-height: 1; display: block; margin-bottom: 18px; }
.step h3 { font-family: var(--serif); font-weight: 600; font-size: 1.4rem; margin-bottom: 8px; }
.step p { color: var(--muted); font-size: 15px; }

/* PRICES */
.badge-ua { display: none; width: fit-content; margin: -24px auto 36px; padding: 6px 16px; font-size: 10px; font-weight: 500; letter-spacing: .16em; text-transform: uppercase; color: var(--gold-bright); border: 1px solid var(--gold-dim); border-radius: 999px; background: rgba(212, 175, 55, .07); }
html[lang="uk"] .badge-ua { display: block; }
.prices-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px; align-items: stretch; }
.price-card {
  position: relative; display: flex; flex-direction: column; padding: 34px 26px 26px;
  background: var(--card); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border: 1px solid var(--line); border-radius: var(--radius);
  transition: border-color .3s, box-shadow .4s, transform .3s var(--ease);
}
.price-card::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; background: radial-gradient(300px circle at var(--mx, 50%) var(--my, 0%), rgba(212, 175, 55, .09), transparent 60%); opacity: 0; transition: opacity .3s; }
.price-card:hover { border-color: var(--line-strong); transform: translateY(-6px); box-shadow: 0 20px 56px rgba(74, 53, 150, .28); }
.price-card:hover::after { opacity: 1; }
.price-card.featured { border-color: rgba(212, 175, 55, .5); background: linear-gradient(170deg, rgba(212, 175, 55, .1), var(--card) 55%); transform: translateY(-8px); }
.price-card.featured:hover { transform: translateY(-12px); }
.ribbon { position: absolute; top: -12px; left: 50%; translate: -50% 0; background: linear-gradient(135deg, var(--gold), var(--gold-bright)); color: #1a1408; font-size: 10px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; padding: 5px 14px; border-radius: 999px; white-space: nowrap; }
.pc-title { font-family: var(--serif); font-weight: 600; font-size: 1.55rem; margin-bottom: 4px; }
.pc-dur { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--violet-soft); margin-bottom: 20px; }
.price-card ul { flex: 1; margin-bottom: 24px; }
.price-card li { position: relative; padding-left: 20px; margin-bottom: 10px; font-size: 14.5px; color: var(--muted); }
.price-card li::before { content: "✧"; position: absolute; left: 0; top: 1px; color: var(--gold); font-size: 11px; }
.pc-price { font-family: var(--display); font-size: 2.1rem; font-weight: 500; color: var(--gold-bright); line-height: 1.1; }
.pc-old { display: block; font-size: 13px; color: var(--muted); text-decoration: line-through; opacity: .6; margin: 4px 0 18px; min-height: 20px; }
.price-card .btn { width: 100%; padding: 13px 16px; font-size: 11px; }
.prices-note { text-align: center; margin-top: 28px; font-size: 13px; color: var(--muted); opacity: .85; }

/* DRAW */
.draw { text-align: center; }
.draw-stage { display: flex; flex-direction: column; align-items: center; gap: 30px; }
.flip { width: 230px; aspect-ratio: 2/3.3; perspective: 1200px; cursor: pointer; }
.flip-inner { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; transition: transform 1s var(--ease); }
.flip.open .flip-inner { transform: rotateY(180deg); }
.face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 16px; border: 1px solid var(--line-strong); box-shadow: 0 24px 70px rgba(0, 0, 0, .6), 0 0 50px rgba(74, 53, 150, .3); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; }
.face.back {
  background:
    radial-gradient(circle at 50% 50%, rgba(212, 175, 55, .2), transparent 45%),
    repeating-linear-gradient(45deg, rgba(212, 175, 55, .07) 0 2px, transparent 2px 14px),
    linear-gradient(160deg, #2a1b4d, #120a24);
}
.face.back::before { content: ""; position: absolute; inset: 10px; border: 1px solid var(--gold-dim); border-radius: 10px; }
.face.back .sig { font-size: 56px; color: var(--gold-bright); filter: drop-shadow(0 0 16px rgba(240, 207, 110, .6)); animation: pulse 3.4s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .6; transform: scale(.94); } }
.face.front { transform: rotateY(180deg); background: linear-gradient(160deg, #241545, #0f0a1e); padding: 18px; text-align: center; }
.face.front::before { content: ""; position: absolute; inset: 10px; border: 1px solid var(--gold-dim); border-radius: 10px; }
.face.front .num { font-family: var(--display); font-size: 13px; letter-spacing: .34em; color: var(--gold); }
.face.front .glyph { font-size: 64px; color: var(--gold-bright); filter: drop-shadow(0 0 18px rgba(240, 207, 110, .55)); line-height: 1; }
.face.front .nm { font-family: var(--display); font-size: 14px; letter-spacing: .2em; text-transform: uppercase; }
.draw-text { max-width: 46ch; min-height: 96px; }
.draw-text h3 { font-family: var(--serif); font-style: italic; font-weight: 500; font-size: 1.7rem; color: var(--gold-bright); margin-bottom: 8px; }
.draw-text p { color: var(--muted); font-size: 16px; }
.draw-hint { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }

/* SPACE */
.space-grid { display: grid; grid-template-columns: 1.3fr 1fr 1fr; gap: 18px; }
.space-item { position: relative; }
.space-thumb { aspect-ratio: 4/3.4; border-radius: var(--radius); border: 1px solid var(--line); background: linear-gradient(145deg, var(--violet-deep), var(--bg-2)); display: grid; place-items: center; text-align: center; color: var(--muted); font-size: 13px; padding: 14px; margin-bottom: 14px; position: relative; overflow: hidden; transition: .3s var(--ease); }
.space-thumb::before { content: ""; position: absolute; inset: 0; background: radial-gradient(circle at 70% 25%, rgba(212, 175, 55, .13), transparent 55%); }
.space-item:hover .space-thumb { border-color: var(--line-strong); box-shadow: 0 0 40px rgba(74, 53, 150, .3); transform: translateY(-3px); }
.space-item h3 { font-family: var(--serif); font-weight: 600; font-size: 1.25rem; }
.space-item p { font-size: 14px; color: var(--muted); }

/* FAQ */
.faq { max-width: 760px; margin-inline: auto; }
.faq details { border-bottom: 1px solid var(--line); }
.faq summary { list-style: none; cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 20px; padding: 22px 4px; font-family: var(--serif); font-size: 1.3rem; font-weight: 500; transition: color .2s; }
.faq summary::-webkit-details-marker { display: none; }
.faq summary::after { content: "+"; color: var(--gold); font-size: 1.6rem; font-family: var(--sans); font-weight: 300; transition: transform .3s var(--ease); }
.faq details[open] summary { color: var(--gold-bright); }

let lang = "uk";
let current = null;      // index of drawn card or null
const $ = id => document.getElementById(id);

function esc(s) { return String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c])); }

function renderDraw() {
  const t = T[lang];
  const open = current !== null;
  $("flip").classList.toggle("open", open);
  $("flip").setAttribute("aria-label", t.draw_btn);
  $("drawBtn").textContent = open ? t.draw_again : t.draw_btn;
  if (open) {
    const c = CARDS[current], tx = t.cards[c.k];
    $("dNum").textContent = c.n; $("dGlyph").textContent = c.g; $("dName").textContent = tx[0];
    $("dTitle").textContent = tx[0]; $("dText").textContent = tx[1];
  } else {
    $("dTitle").textContent = t.draw_idle_t; $("dText").textContent = t.draw_idle_p;
  }
}

function drawCard() {
  const flip = $("flip");
  const wasOpen = current !== null;
  const pick = () => {
    let n; do { n = Math.floor(Math.random() * CARDS.length); } while (n === current);
    current = n; renderDraw();
  };
  if (wasOpen) {
    flip.classList.remove("open");
    setTimeout(pick, 650);
  } else pick();
}

function render() {
  const t = T[lang];
  document.documentElement.lang = lang;

  document.querySelectorAll("[data-i18n]").forEach(el => {
    const v = t[el.dataset.i18n];
    if (v != null && typeof v === "string") el.innerHTML = v;
  });

  document.querySelectorAll(".lang button").forEach(b =>
    b.setAttribute("aria-pressed", b.dataset.lang === lang ? "true" : "false"));

  // marquee (duplicated for seamless loop)
  const row = t.marquee.map(m => `<span>${esc(m)}</span>`).join("");
  $("marquee").innerHTML = row + row;

  // steps
  $("steps").innerHTML = t.steps.map((s, i) =>
    `<div class="step rv in" style="--d:${i * .1}s"><h3>${esc(s.t)}</h3><p>${esc(s.p)}</p></div>`).join("");

  // prices
  $("priceGrid").innerHTML = SERVICES.map((s, i) => {
    const c = t[s.id];
    const price = lang === "uk"
      ? `<div class="pc-price">${s.uah} ₴</div><span class="pc-old">${s.uahOld} ₴</span>`
      : `<div class="pc-price">€${s.eur}</div><span class="pc-old"></span>`;
    return `
      <article class="price-card rv in${s.featured ? " featured" : ""}" style="--d:${i * .1}s">
        ${s.featured ? `<span class="ribbon">${esc(t.popular)}</span>` : ""}
        <h3 class="pc-title">${esc(c.n)}</h3>
        <p class="pc-dur">${esc(c.d)}</p>
        <ul>${c.l.map(x => `<li>${esc(x)}</li>`).join("")}</ul>
        ${price}
        <a class="btn ${s.featured ? "btn-gold" : "btn-outline"}" href="#contact">${esc(t.book)}</a>
      </article>`;
  }).join("");
  document.querySelectorAll(".price-card").forEach(card => {
    card.addEventListener("pointermove", e => {
      const r = card.getBoundingClientRect();
      card.style.setProperty("--mx", (e.clientX - r.left) + "px");
      card.style.setProperty("--my", (e.clientY - r.top) + "px");
    });
  });

  // FAQ
  $("faqList").innerHTML = t.faq.map(f =>
    `<details><summary>${esc(f.q)}</summary><p class="ans">${esc(f.a)}</p></details>`).join("");

  renderDraw();
  try { localStorage.setItem("km_lang", lang); } catch (e) {}
}

/* zodiac ring */
(function buildRing() {
  const ticks = $("ticks"), zod = $("zod");
  const NS = "http://www.w3.org/2000/svg";
  for (let i = 0; i < 72; i++) {
    const a = i * 5 * Math.PI / 180, long = i % 6 === 0;
    const r1 = 196, r2 = long ? 184 : 190;
    const l = document.createElementNS(NS, "line");
    l.setAttribute("x1", 200 + r1 * Math.sin(a)); l.setAttribute("y1", 200 - r1 * Math.cos(a));
    l.setAttribute("x2", 200 + r2 * Math.sin(a)); l.setAttribute("y2", 200 - r2 * Math.cos(a));
    ticks.appendChild(l);
  }
  const signs = "♈♉♊♋♌♍♎♏♐♑♒♓";
  [...signs].forEach((s, i) => {
    const a = (i * 30 + 15) * Math.PI / 180, r = 164;
    const tx = document.createElementNS(NS, "text");
    tx.setAttribute("x", 200 + r * Math.sin(a)); tx.setAttribute("y", 205 - r * Math.cos(a));
    tx.textContent = s + "\uFE0E";
    zod.appendChild(tx);
  });
})();

/* events */
document.querySelectorAll(".lang button").forEach(b =>
  b.addEventListener("click", () => { lang = b.dataset.lang; render(); }));

const burger = $("burger"), mobileNav = $("mobileNav");
burger.addEventListener("click", () => {
  const open = burger.getAttribute("aria-expanded") === "true";
  burger.setAttribute("aria-expanded", String(!open));
  mobileNav.classList.toggle("open", !open);
});
mobileNav.querySelectorAll("a").forEach(a => a.addEventListener("click", () => {
  burger.setAttribute("aria-expanded", "false"); mobileNav.classList.remove("open");
}));

$("drawBtn").addEventListener("click", drawCard);
$("flip").addEventListener("click", () => { if (current === null) drawCard(); });
$("flip").addEventListener("keydown", e => {
  if (e.key === "Enter" || e.key === " ") { e.preventDefault(); drawCard(); }
});

const header = $("header");
const onScroll = () => header.classList.toggle("scrolled", window.scrollY > 24);
window.addEventListener("scroll", onScroll, { passive: true }); onScroll();

/* cursor glow */
const glow = $("glow");
window.addEventListener("pointermove", e => {
  glow.style.opacity = 1;
  glow.style.transform = `translate(${e.clientX - 210}px, ${e.clientY - 210}px)`;
}, { passive: true });

/* scroll reveal */
const io = "IntersectionObserver" in window
  ? new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } }), { threshold: .12, rootMargin: "0px 0px -40px 0px" })
  : null;
document.querySelectorAll(".rv").forEach(el => io ? io.observe(el) : el.classList.add("in"));

/* starfield */
(function stars() {
  const cv = $("stars"), ctx = cv.getContext("2d");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let w, h, S = [], dpr = Math.min(devicePixelRatio || 1, 2);
  function size() {
    w = innerWidth; h = innerHeight;
    cv.width = w * dpr; cv.height = h * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const n = Math.round(w * h / 9000);
    S = Array.from({ length: n }, () => ({
      x: Math.random() * w, y: Math.random() * h, r: Math.random() * 1.2 + .2,
      p: Math.random() * 6.28, s: Math.random() * .02 + .005,
      c: Math.random() < .2 ? "212,175,55" : "225,218,255"
    }));
  }
  function frame(t) {
    ctx.clearRect(0, 0, w, h);
    for (const s of S) {
      const a = .25 + .6 * (.5 + .5 * Math.sin(s.p + t * s.s * .06));
      ctx.fillStyle = `rgba(${s.c},${a})`;
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 6.283); ctx.fill();
    }
    if (!reduce) requestAnimationFrame(frame);
  }
  size(); addEventListener("resize", size);
  requestAnimationFrame(frame);
})();

try {
  lang = localStorage.getItem("km_lang") ||
    ((navigator.language || "").toLowerCase().startsWith("uk") ? "uk" : "en");
} catch (e) {}
render();
</script>
